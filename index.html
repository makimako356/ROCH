<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCH - Richest Only Come Here</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e8edf3;
            color: #17202a;
        }

        /* START SCREEN */

        #startScreen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dfe9f3, #ffffff);
        }

        #startScreen h1 {
            font-size: 72px;
            margin: 0;
            letter-spacing: 5px;
        }

        #startScreen h2 {
            margin-top: 5px;
            color: #566573;
            font-weight: normal;
        }

        #startScreen p {
            margin-top: 35px;
            font-size: 18px;
        }

        select {
            padding: 10px 18px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #aaa;
        }

        button {
            padding: 14px 30px;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #2874a6;
            color: white;
        }

        button:hover {
            background: #1f618d;
            transform: scale(1.03);
        }


        /* GAME */

        #gameScreen {
            display: none;
            min-height: 100vh;
            padding: 25px;
        }

        .game-header {
            background: white;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .game-header h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: 3px;
        }

        .game-header h2 {
            margin: 5px;
            color: #566573;
            font-weight: normal;
        }


        /* TURN AREA */

        .turn-area {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 0 auto 25px auto;
            max-width: 700px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .turn-area h2 {
            margin: 5px;
        }

        #diceResult {
            font-size: 28px;
            font-weight: bold;
            margin: 15px;
        }

        #moneyResult {
            font-size: 20px;
            color: #196f3d;
            margin: 10px;
        }


        /* COMPANIES */

        .companies {
            display: grid;
            grid-template-columns: repeat(2, minmax(350px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: auto;
        }

        .company-map {
            background: #ffffff;
            border: 3px solid #34495e;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .company-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d5d8dc;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .company-title h2 {
            margin: 0;
        }

        .cash {
            background: #d5f5e3;
            color: #196f3d;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
        }


        /* STOCK MAP */

        .stock-map {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #d6eaf8;
            padding: 10px;
            border-radius: 12px;
        }

        .stock {
            min-height: 100px;
            background: #ffffff;
            border: 2px solid #7fb3d5;
            border-radius: 10px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stock-name {
            font-size: 18px;
            font-weight: bold;
        }

        .stock-value {
            margin-top: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #2874a6;
        }

        .stock-number {
            margin-top: 4px;
            font-size: 12px;
            color: #7b7d7d;
        }


        @media (max-width: 800px) {

            .companies {
                grid-template-columns: 1fr;
            }

            #startScreen h1 {
                font-size: 52px;
            }

            .stock-map {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>


<body>

    <!-- START SCREEN -->

    <div id="startScreen">

        <h1>ROCH</h1>

        <h2>RICHEST ONLY COME HERE</h2>

        <p>Choose the number of rounds:</p>

        <select id="roundSelect">

            <option value="3">3 rounds</option>
            <option value="5">5 rounds</option>
            <option value="10">10 rounds</option>

        </select>

        <button onclick="startGame()">
            START GAME
        </button>

    </div>


    <!-- GAME SCREEN -->

    <div id="gameScreen">

        <div class="game-header">

            <h1>ROCH</h1>

            <h2 id="roundText"></h2>

        </div>


        <!-- TURN -->

        <div class="turn-area">

            <h2 id="turnText">
                Your turn
            </h2>

            <div id="diceResult">
                🎲 —
            </div>

            <div id="moneyResult">
                Roll the dice to receive money.
            </div>

            <button onclick="rollIncome()">
                🎲 ROLL FOR INCOME
            </button>

        </div>


        <!-- COMPANIES -->

        <div id="companies" class="companies"></div>

    </div>


    <script>

        let totalRounds = 3;
        let currentRound = 1;


        /* STOCKS */

        const stockTypes = [

            {
                name: "Stock A",
                value: 400
            },

            {
                name: "Stock B",
                value: 500
            },

            {
                name: "Stock C",
                value: 600
            },

            {
                name: "Stock D",
                value: 700
            },

            {
                name: "Stock E",
                value: 800
            },

            {
                name: "Stock F",
                value: 900
            }

        ];


        /* MONEY CARDS */

        const moneyValues = [
            100,
            200,
            300,
            400,
            500
        ];


        /* COMPANIES */

        const companies = [

            {
                name: "YOUR COMPANY",
                money: 0,
                stocks: []
            },

            {
                name: "BOT 1",
                money: 0,
                stocks: []
            },

            {
                name: "BOT 2",
                money: 0,
                stocks: []
            },

            {
                name: "BOT 3",
                money: 0,
                stocks: []
            }

        ];


        /* DRAW STOCKS */

        function drawStocks() {

            let stocks = [];

            for (let i = 0; i < 5; i++) {

                let randomStock =
                    stockTypes[
                        Math.floor(
                            Math.random() *
                            stockTypes.length
                        )
                    ];

                stocks.push({

                    name: randomStock.name,

                    value: randomStock.value

                });

            }

            return stocks;
        }


        /* DRAW ONE MONEY CARD */

        function drawMoneyCard() {

            return moneyValues[
                Math.floor(
                    Math.random() *
                    moneyValues.length
                )
            ];
        }


        /* START GAME */

        function startGame() {

            totalRounds =
                Number(
                    document.getElementById(
                        "roundSelect"
                    ).value
                );

            currentRound = 1;


            companies.forEach(company => {

                company.stocks =
                    drawStocks();


                let stockTotal =
                    company.stocks.reduce(

                        (sum, stock) =>
                            sum + stock.value,

                        0

                    );


                company.money =
                    5000 - stockTotal;

            });


            document.getElementById(
                "startScreen"
            ).style.display = "none";


            document.getElementById(
                "gameScreen"
            ).style.display = "block";


            document.getElementById(
                "turnText"
            ).textContent =
                "Your turn";


            document.getElementById(
                "diceResult"
            ).textContent =
                "🎲 —";


            document.getElementById(
                "moneyResult"
            ).textContent =
                "Roll the dice to receive money.";


            updateGameScreen();
        }


        /* ROLL FOR INCOME */

        function rollIncome() {

            const dice =
                Math.floor(
                    Math.random() * 6
                ) + 1;


            let totalMoney = 0;

            let cards = [];


            /*
                The dice tells us
                how many money cards
                we draw.
            */

            for (let i = 0; i < dice; i++) {

                const card =
                    drawMoneyCard();

                cards.push(card);

                totalMoney += card;
            }


            /*
                Add the money
                to YOUR COMPANY.
            */

            companies[0].money += totalMoney;


            document.getElementById(
                "diceResult"
            ).textContent =
                "🎲 You rolled: " + dice;


            document.getElementById(
                "moneyResult"
            ).textContent =
                "💰 Money cards: " +
                cards.map(value => "$" + value).join(", ") +
                " = $" +
                totalMoney;


            updateGameScreen();
        }


        /* DISPLAY GAME */

        function updateGameScreen() {

            document.getElementById(
                "roundText"
            ).textContent =
                "Round " +
                currentRound +
                " / " +
                totalRounds;


            const container =
                document.getElementById(
                    "companies"
                );


            container.innerHTML = "";


            companies.forEach(company => {

                const map =
                    document.createElement(
                        "div"
                    );


                map.className =
                    "company-map";


                let stocksHTML = "";


                company.stocks.forEach(
                    (stock, index) => {

                        stocksHTML += `

                            <div class="stock">

                                <div class="stock-name">
                                    ${stock.name}
                                </div>

                                <div class="stock-value">
                                    $${stock.value}
                                </div>

                                <div class="stock-number">
                                    Stock ${index + 1}
                                </div>

                            </div>

                        `;

                    }
                );


                map.innerHTML = `

                    <div class="company-title">

                        <h2>
                            ${company.name}
                        </h2>

                        <div class="cash">
                            CASH: $${company.money}
                        </div>

                    </div>


                    <div class="stock-map">

                        ${stocksHTML}

                    </div>

                `;


                container.appendChild(map);

            });

        }

    </script>

</body>
</html>

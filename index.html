<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCH - Richest Only Come Here</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e8edf3;
            color: #17202a;
        }

        #startScreen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dfe9f3, #ffffff);
        }

        #startScreen h1 {
            font-size: 72px;
            margin: 0;
            letter-spacing: 5px;
        }

        #startScreen h2 {
            margin-top: 5px;
            color: #566573;
            font-weight: normal;
        }

        #startScreen p {
            margin-top: 35px;
            font-size: 18px;
        }

        select {
            padding: 10px 18px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #aaa;
        }

        button {
            padding: 10px 16px;
            margin: 5px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #2874a6;
            color: white;
        }

        button:hover {
            background: #1f618d;
        }

        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        #startScreen button {
            padding: 14px 30px;
            font-size: 20px;
            margin-top: 20px;
        }

        #gameScreen {
            display: none;
            min-height: 100vh;
            padding: 25px;
        }

        .game-header {
            background: white;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .game-header h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: 3px;
        }

        .game-header h2 {
            margin: 5px;
            color: #566573;
            font-weight: normal;
        }

        .turn-area {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 0 auto 25px auto;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .turn-area h2 {
            margin: 5px;
        }

        #diceResult {
            font-size: 28px;
            font-weight: bold;
            margin: 15px;
        }

        #moneyResult {
            font-size: 18px;
            color: #196f3d;
            margin: 10px;
            min-height: 25px;
        }

        #actionMessage {
            font-size: 17px;
            min-height: 25px;
            margin: 10px;
        }

        .companies {
            display: grid;
            grid-template-columns: repeat(2, minmax(350px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: auto;
        }

        .company-map {
            background: #ffffff;
            border: 3px solid #34495e;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .active-company {
            border: 4px solid #2874a6;
            box-shadow: 0 0 15px rgba(40,116,166,0.35);
        }

        .company-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d5d8dc;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .company-title h2 {
            margin: 0;
        }

        .cash {
            background: #d5f5e3;
            color: #196f3d;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .stock-map {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #d6eaf8;
            padding: 10px;
            border-radius: 12px;
        }

        .stock {
            min-height: 130px;
            background: #ffffff;
            border: 2px solid #7fb3d5;
            border-radius: 10px;
            padding: 8px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stock.open {
            border: 3px solid #f39c12;
            background: #fef5e7;
        }

        .stock-name {
            font-size: 17px;
            font-weight: bold;
        }

        .stock-value {
            margin-top: 7px;
            font-size: 19px;
            font-weight: bold;
            color: #2874a6;
        }

        .stock-number {
            margin-top: 3px;
            font-size: 12px;
            color: #7b7d7d;
        }

        .stock-status {
            margin-top: 5px;
            font-size: 12px;
            font-weight: bold;
            color: #d68910;
        }

        .stock button {
            font-size: 11px;
            padding: 6px 8px;
            margin: 3px;
        }

        @media (max-width: 800px) {
            .companies {
                grid-template-columns: 1fr;
            }

            #startScreen h1 {
                font-size: 52px;
            }

            .stock-map {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div id="startScreen">

    <h1>ROCH</h1>

    <h2>RICHEST ONLY COME HERE</h2>

    <p>Choose the number of rounds:</p>

    <select id="roundSelect">
        <option value="3">3 rounds</option>
        <option value="5">5 rounds</option>
        <option value="10">10 rounds</option>
    </select>

    <button onclick="startGame()">START GAME</button>

</div>


<div id="gameScreen">

    <div class="game-header">
        <h1>ROCH</h1>
        <h2 id="roundText"></h2>
    </div>


    <div class="turn-area">

        <h2 id="turnText">Your turn</h2>

        <div id="diceResult">🎲 —</div>

        <div id="moneyResult">
            Waiting for income...
        </div>

        <div id="actionMessage">
            Roll for income to begin your turn.
        </div>

        <button id="rollButton" onclick="rollIncome()">
            🎲 ROLL FOR INCOME
        </button>

        <div id="actionButtons"></div>

    </div>


    <div id="companies" class="companies"></div>

</div>


<script>

let totalRounds = 3;
let currentRound = 1;
let currentPlayer = 0;

let incomeRolled = false;
let turnActionFinished = false;


/* ---------------- STOCK TYPES ---------------- */

const stockTypes = [

    {
        name: "Stock A",
        value: 400,
        changes: [-100, -50, 0, 50, 100, 200]
    },

    {
        name: "Stock B",
        value: 500,
        changes: [-200, -100, -50, 50, 100, 300]
    },

    {
        name: "Stock C",
        value: 600,
        changes: [-50, 0, 50, 100, 150, 200]
    },

    {
        name: "Stock D",
        value: 700,
        changes: [-200, -100, 0, 100, 200, 400]
    },

    {
        name: "Stock E",
        value: 800,
        changes: [-300, -100, 0, 100, 200, 500]
    },

    {
        name: "Stock F",
        value: 900,
        changes: [-400, -200, -50, 100, 300, 600]
    }

];


/* ---------------- MONEY CARDS ---------------- */

const moneyValues = [
    100,
    200,
    300,
    400,
    500
];


/* ---------------- COMPANIES ---------------- */

const companies = [

    {
        name: "YOUR COMPANY",
        money: 0,
        stocks: []
    },

    {
        name: "BOT 1",
        money: 0,
        stocks: []
    },

    {
        name: "BOT 2",
        money: 0,
        stocks: []
    },

    {
        name: "BOT 3",
        money: 0,
        stocks: []
    }

];


/* ---------------- DRAW STOCK ---------------- */

function drawStocks() {

    let stocks = [];

    for (let i = 0; i < 5; i++) {

        let randomStock =
            stockTypes[
                Math.floor(
                    Math.random() *
                    stockTypes.length
                )
            ];

        stocks.push({

            name: randomStock.name,

            value: randomStock.value,

            changes: [...randomStock.changes],

            open: false

        });

    }

    // חובה שלפחות מניה אחת תהיה פתוחה
    if (stocks.length > 0) {
        stocks[0].open = true;
    }

    return stocks;
}


/* ---------------- MONEY ---------------- */

function drawMoneyCard() {

    return moneyValues[
        Math.floor(
            Math.random() *
            moneyValues.length
        )
    ];

}


/* ---------------- START GAME ---------------- */

function startGame() {

    totalRounds =
        Number(
            document.getElementById(
                "roundSelect"
            ).value
        );

    currentRound = 1;
    currentPlayer = 0;

    companies.forEach(company => {

        company.stocks = drawStocks();

        let stockTotal =
            company.stocks.reduce(
                (sum, stock) =>
                    sum + stock.value,
                0
            );

        company.money =
            5000 - stockTotal;

    });

    document.getElementById(
        "startScreen"
    ).style.display = "none";

    document.getElementById(
        "gameScreen"
    ).style.display = "block";

    startTurn();

}


/* ---------------- START TURN ---------------- */

function startTurn() {

    incomeRolled = false;
    turnActionFinished = false;

    document.getElementById(
        "turnText"
    ).textContent =
        companies[currentPlayer].name +
        "'s turn";

    document.getElementById(
        "diceResult"
    ).textContent =
        "🎲 —";

    document.getElementById(
        "moneyResult"
    ).textContent =
        "Roll for income.";

    document.getElementById(
        "actionMessage"
    ).textContent =
        "";

    document.getElementById(
        "actionButtons"
    ).innerHTML = "";

    if (currentPlayer === 0) {

        document.getElementById(
            "rollButton"
        ).style.display = "inline-block";

        document.getElementById(
            "rollButton"
        ).disabled = false;

    } else {

        document.getElementById(
            "rollButton"
        ).style.display = "none";

        setTimeout(
            botTurn,
            1000
        );

    }

    updateGameScreen();

}


/* ---------------- INCOME ---------------- */

function rollIncome() {

    if (currentPlayer !== 0) {
        return;
    }

    performIncomeRoll();

}


function performIncomeRoll() {

    const dice =
        Math.floor(
            Math.random() * 6
        ) + 1;

    let totalMoney = 0;
    let cards = [];

    for (let i = 0; i < dice; i++) {

        const card =
            drawMoneyCard();

        cards.push(card);
        totalMoney += card;

    }

    companies[currentPlayer].money +=
        totalMoney;

    incomeRolled = true;

    document.getElementById(
        "diceResult"
    ).textContent =
        "🎲 Rolled: " + dice;

    document.getElementById(
        "moneyResult"
    ).textContent =
        "💰 " +
        cards.map(x => "$" + x).join(", ") +
        " = $" + totalMoney;

    document.getElementById(
        "rollButton"
    ).disabled = true;

    showActions();

    updateGameScreen();

}


/* ---------------- ACTION BUTTONS ---------------- */

function showActions() {

    const area =
        document.getElementById(
            "actionButtons"
        );

    area.innerHTML = `

        <button onclick="finishTurn()">
            END TURN
        </button>

    `;

}


/* ---------------- OPEN / CLOSE STOCK ---------------- */

function toggleStock(playerIndex, stockIndex) {

    if (currentPlayer !== playerIndex) {
        return;
    }

    if (!incomeRolled) {
        return;
    }

    const company =
        companies[playerIndex];

    const stock =
        company.stocks[stockIndex];


    if (stock.open) {

        /*
            Cannot close it if this
            is the only open stock.
        */

        const openCount =
            company.stocks.filter(
                s => s.open
            ).length;

        if (openCount <= 1) {

            document.getElementById(
                "actionMessage"
            ).textContent =
                "You must keep at least one stock open for sale.";

            return;

        }

        stock.open = false;

    } else {

        stock.open = true;

    }

    updateGameScreen();

}


/* ---------------- PRICE ROLL ---------------- */

function getStockPrice(stock) {

    const dice =
        Math.floor(
            Math.random() * 6
        ) + 1;

    const change =
        stock.changes[dice - 1];

    const price =
        stock.value + change;

    return {
        dice: dice,
        change: change,
        price: price
    };

}


/* ---------------- BUY STOCK ---------------- */

function buyStock(
    sellerIndex,
    stockIndex
) {

    if (!incomeRolled) {
        return;
    }

    if (sellerIndex === currentPlayer) {
        return;
    }

    const seller =
        companies[sellerIndex];

    const buyer =
        companies[currentPlayer];

    const stock =
        seller.stocks[stockIndex];


    if (!stock.open) {
        return;
    }


    /*
        The buyer must be able to
        pay even at the maximum
        possible price.
    */

    const maximumPrice =
        Math.max(
            ...stock.changes.map(
                change =>
                    stock.value + change
            )
        );


    if (buyer.money < maximumPrice) {

        document.getElementById(
            "actionMessage"
        ).textContent =
            "You don't have enough money to guarantee this purchase.";

        return;

    }


    /*
        Roll the price die.
    */

    const result =
        getStockPrice(stock);


    /*
        The buyer MUST buy
        at the rolled price.
    */

    buyer.money -= result.price;

    seller.money += result.price;


    /*
        Remove from seller.
    */

    seller.stocks.splice(
        stockIndex,
        1
    );


    /*
        Give stock to buyer.
    */

    stock.open = false;

    buyer.stocks.push(stock);


    /*
        Seller must still have
        one open stock if they
        still own stocks.
    */

    if (
        seller.stocks.length > 0 &&
        !seller.stocks.some(
            s => s.open
        )
    ) {

        seller.stocks[0].open = true;

    }


    document.getElementById(
        "diceResult"
    ).textContent =
        "🎲 Price roll: " +
        result.dice;

    document.getElementById(
        "actionMessage"
    ).textContent =
        "Bought " +
        stock.name +
        " for $" +
        result.price +
        " (" +
        (result.change >= 0 ? "+" : "") +
        result.change +
        ").";


    updateGameScreen();

}


/* ---------------- SELL TO BANK ---------------- */

function sellToBank(stockIndex) {

    if (!incomeRolled) {
        return;
    }

    const company =
        companies[currentPlayer];

    const stock =
        company.stocks[stockIndex];


    /*
        Bank always pays
        the base value.
    */

    company.money +=
        stock.value;


    company.stocks.splice(
        stockIndex,
        1
    );


    /*
        If stocks remain,
        at least one must be open.
    */

    if (
        company.stocks.length > 0 &&
        !company.stocks.some(
            s => s.open
        )
    ) {

        company.stocks[0].open = true;

    }


    document.getElementById(
        "actionMessage"
    ).textContent =
        "Sold " +
        stock.name +
        " to the bank for $" +
        stock.value + ".";


    updateGameScreen();

}


/* ---------------- BOT ---------------- */

function botTurn() {

    /*
        First receive income.
    */

    performIncomeRoll();


    setTimeout(() => {

        const bot =
            companies[currentPlayer];


        /*
            Very simple temporary
            bot behavior:

            1. Try to sell one stock
               to the bank if it has
               lots of cash.
            2. Otherwise end turn.
        */

        if (
            bot.stocks.length > 5 &&
            bot.stocks.length > 0
        ) {

            bot.money +=
                bot.stocks[0].value;

            bot.stocks.splice(0, 1);

        }


        setTimeout(
            nextTurn,
            1000
        );

    }, 1200);

}


/* ---------------- END TURN ---------------- */

function finishTurn() {

    if (!incomeRolled) {
        return;
    }

    nextTurn();

}


/* ---------------- NEXT TURN ---------------- */

function nextTurn() {

    currentPlayer++;


    if (
        currentPlayer >=
        companies.length
    ) {

        currentPlayer = 0;

        currentRound++;

        if (
            currentRound >
            totalRounds
        ) {

            currentRound = 1;

        }

    }


    startTurn();

}


/* ---------------- DISPLAY ---------------- */

function updateGameScreen() {

    document.getElementById(
        "roundText"
    ).textContent =
        "Round " +
        currentRound +
        " / " +
        totalRounds;


    const container =
        document.getElementById(
            "companies"
        );

    container.innerHTML = "";


    companies.forEach(
        (company, companyIndex) => {

            const map =
                document.createElement(
                    "div"
                );

            map.className =
                "company-map";


            if (
                companyIndex ===
                currentPlayer
            ) {

                map.classList.add(
                    "active-company"
                );

            }


            let stocksHTML = "";


            company.stocks.forEach(
                (stock, stockIndex) => {

                    let buttons = "";


                    /*
                        Your own stock:
                        open / close and
                        sell to bank.
                    */

                    if (
                        companyIndex ===
                        currentPlayer &&
                        incomeRolled
                    ) {

                        buttons += `

                            <button
                                onclick="toggleStock(
                                    ${companyIndex},
                                    ${stockIndex}
                                )"
                            >
                                ${stock.open
                                    ? "CLOSE SALE"
                                    : "OPEN FOR SALE"}
                            </button>

                            <button
                                onclick="sellToBank(
                                    ${stockIndex}
                                )"
                            >
                                SELL TO BANK
                            </button>

                        `;

                    }


                    /*
                        Other player's
                        open stock:
                        buy button.
                    */

                    if (
                        companyIndex !==
                        currentPlayer &&
                        stock.open &&
                        incomeRolled
                    ) {

                        buttons += `

                            <button
                                onclick="buyStock(
                                    ${companyIndex},
                                    ${stockIndex}
                                )"
                            >
                                BUY
                            </button>

                        `;

                    }


                    stocksHTML += `

                        <div class="stock
                            ${stock.open ? "open" : ""}">

                            <div class="stock-name">
                                ${stock.name}
                            </div>

                            <div class="stock-value">
                                $${stock.value}
                            </div>

                            <div class="stock-number">
                                Stock ${stockIndex + 1}
                            </div>

                            <div class="stock-status">
                                ${stock.open
                                    ? "OPEN FOR SALE"
                                    : "NOT FOR SALE"}
                            </div>

                            ${buttons}

                        </div>

                    `;

                }
            );


            map.innerHTML = `

                <div class="company-title">

                    <h2>
                        ${company.name}
                    </h2>

                    <div class="cash">
                        CASH: $${company.money}
                    </div>

                </div>

                <div class="stock-map">
                    ${stocksHTML}
                </div>

            `;


            container.appendChild(map);

        }
    );

}

</script>

</body>
</html>
</body>
</html>

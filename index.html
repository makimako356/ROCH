<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROCH — Richest Only Come Here</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#dfeaf3;
    color:#17202a;
}

header{
    background:#243b53;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{margin:0 0 5px;font-size:34px}
header p{margin:0;opacity:.85}

#topBar{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    padding:15px;
    background:#f7fafc;
    border-bottom:1px solid #cbd5e0;
}

.infoBox{
    background:white;
    padding:10px 16px;
    border-radius:10px;
    box-shadow:0 2px 6px #0002;
    font-weight:bold;
}

#game{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

#actions{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 3px 10px #0002;
    text-align:center;
}

#status{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 13px;
    cursor:pointer;
    font-weight:bold;
    background:#3182ce;
    color:white;
    margin:3px;
}

button:hover:not(:disabled){background:#2b6cb0}
button:disabled{opacity:.45;cursor:not-allowed}

button.sell{background:#e53e3e}
button.open{background:#38a169}
button.close{background:#718096}
button.buy{background:#805ad5}
button.bank{background:#dd6b20}
button.keep{background:#319795}
button.big{font-size:18px;padding:13px 22px}

.company{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 3px 10px #0002;
    border:3px solid transparent;
}

.company.active{border-color:#3182ce}

.company h2{margin:0 0 8px}

.companyStats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.stat{
    background:#edf2f7;
    padding:7px 12px;
    border-radius:8px;
}

.cash{
    color:#16844a;
    font-weight:bold;
}

.stockGrid{
    display:grid;
    grid-template-columns:repeat(3,minmax(180px,1fr));
    gap:10px;
}

.stock{
    border:2px solid #cbd5e0;
    border-radius:10px;
    padding:10px;
    background:#f8fafc;
}

.stock.openStock{
    border-color:#38a169;
    background:#f0fff4;
}

.stock.closedStock{
    border-color:#a0aec0;
}

.stockName{
    font-weight:bold;
    font-size:18px;
}

.stockValue{margin:4px 0}

.stockStatus{
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
}

.openText{color:#16844a}
.closedText{color:#718096}

.logBox{
    background:#1a202c;
    color:#e2e8f0;
    border-radius:12px;
    padding:15px;
    height:230px;
    overflow-y:auto;
    margin-top:20px;
    font-family:monospace;
}

.logLine{margin-bottom:4px}

.overlay{
    position:fixed;
    inset:0;
    background:#0009;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.modal{
    background:white;
    border-radius:18px;
    padding:30px;
    max-width:600px;
    width:90%;
    text-align:center;
    box-shadow:0 10px 40px #0006;
}

.choiceButtons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.hidden{display:none!important}

#startScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.startBox{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 25px #0003;
}

.roundChoice button{
    font-size:20px;
    padding:15px 25px;
}

@media(max-width:800px){
    .stockGrid{grid-template-columns:repeat(2,minmax(150px,1fr))}
}

@media(max-width:550px){
    .stockGrid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="startScreen">
    <div class="startBox">
        <h1>ROCH</h1>
        <h2>Richest Only Come Here</h2>
        <p>Become the most successful company.</p>

        <h3>בחר מספר סיבובים:</h3>

        <div class="roundChoice">
            <button onclick="startGame(3)">3</button>
            <button onclick="startGame(5)">5</button>
            <button onclick="startGame(10)">10</button>
        </div>
    </div>
</div>

<div id="gameScreen" class="hidden">

<header>
    <h1>ROCH</h1>
    <p>Richest Only Come Here</p>
</header>

<div id="topBar">
    <div class="infoBox">סיבוב: <span id="roundDisplay">1</span></div>
    <div class="infoBox">תור: <span id="turnDisplay">1</span></div>
    <div class="infoBox">תור של: <span id="currentPlayerDisplay"></span></div>
    <div class="infoBox">סה"כ סיבובים: <span id="totalRoundsDisplay"></span></div>
</div>

<div id="game">

    <div id="actions">
        <div id="status"></div>
        <div id="actionButtons"></div>
    </div>

    <div id="companies"></div>

    <div class="logBox" id="log"></div>

</div>
</div>

<div id="roundModal" class="overlay hidden">
    <div class="modal">
        <h2>הסיבוב נגמר!</h2>
        <p id="roundReason"></p>
        <p>עכשיו אפשר לבחור אם למכור את כל המניות לבנק או לשמור אותן.</p>
        <div id="roundChoiceButtons" class="choiceButtons"></div>
    </div>
</div>

<div id="gameOverModal" class="overlay hidden">
    <div class="modal">
        <h2>ROCH — המשחק נגמר!</h2>
        <div id="finalResults"></div>
        <button class="big" onclick="location.reload()">משחק חדש</button>
    </div>
</div>

<script>

/* =========================
   מניות
========================= */

const stockTypes=[
    {
        name:"Stock A",
        value:400,
        changes:[-100,-50,0,50,100,200]
    },
    {
        name:"Stock B",
        value:500,
        changes:[-200,-100,-50,50,100,300]
    },
    {
        name:"Stock C",
        value:600,
        changes:[-50,0,50,100,150,200]
    },
    {
        name:"Stock D",
        value:700,
        changes:[-200,-100,0,100,200,400]
    },
    {
        name:"Stock E",
        value:800,
        changes:[-300,-100,0,100,200,500]
    },
    {
        name:"Stock F",
        value:900,
        changes:[-400,-200,-50,100,300,600]
    }
];

const STOCK_COPIES=10;

const MONEY_VALUES=[100,200,300,400,500];
const MONEY_CARDS_PER_VALUE=30;

/* =========================
   מצב המשחק
========================= */

let totalRounds=3;
let currentRound=1;
let turnNumber=1;
let currentPlayer=0;

let companies=[];

let stockDeck=[];
let bankStocks=[];

let moneyDeck=[];

let incomeRolled=false;
let roundEnding=false;
let gameOver=false;
let lastActionTaken=false;

/* =========================
   שחקנים
========================= */

function createPlayers(){

    companies=[
        {
            name:"Your Company",
            bot:false,
            cash:0,
            stocks:[],
            nothingTurns:0,
            scoreHistory:[]
        },
        {
            name:"Bot Alpha",
            bot:true,
            cash:0,
            stocks:[],
            nothingTurns:0,
            scoreHistory:[]
        },
        {
            name:"Bot Beta",
            bot:true,
            cash:0,
            stocks:[],
            nothingTurns:0,
            scoreHistory:[]
        },
        {
            name:"Bot Gamma",
            bot:true,
            cash:0,
            stocks:[],
            nothingTurns:0,
            scoreHistory:[]
        }
    ];
}

/* =========================
   ערבוב
========================= */

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=[array[j],array[i]];
    }
}

/* =========================
   חפיסת מניות
========================= */

function createStockDeck(){

    stockDeck=[];

    for(const type of stockTypes){

        for(let i=0;i<STOCK_COPIES;i++){

            stockDeck.push({
                name:type.name,
                value:type.value,
                changes:[...type.changes],
                open:false
            });
        }
    }

    shuffle(stockDeck);
}

/* =========================
   חפיסת כסף
========================= */

function createMoneyDeck(){

    moneyDeck=[];

    for(const value of MONEY_VALUES){

        for(let i=0;i<MONEY_CARDS_PER_VALUE;i++){

            moneyDeck.push(value);
        }
    }

    shuffle(moneyDeck);
}

/* =========================
   משיכת מניה
========================= */

function drawStock(){

    if(stockDeck.length===0){
        recycleBankStocks();
    }

    if(stockDeck.length===0){
        return null;
    }

    return stockDeck.pop();
}

/* =========================
   החזרת מניות מהבנק
========================= */

function recycleBankStocks(){

    if(bankStocks.length===0)return;

    stockDeck.push(...bankStocks);
    bankStocks=[];

    shuffle(stockDeck);

    log("חפיסת המניות התמלאה מחדש.");
}

/* =========================
   חלוקת 5 מניות
========================= */

function giveFiveStocks(company){

    for(let i=0;i<5;i++){

        const stock=drawStock();

        if(!stock)break;

        stock.open=false;

        company.stocks.push(stock);
    }

    ensureOneOpen(company);
}

/* =========================
   התחלת משחק
========================= */

function startGame(rounds){

    totalRounds=rounds;
    currentRound=1;
    turnNumber=1;
    currentPlayer=0;

    roundEnding=false;
    gameOver=false;
    incomeRolled=false;

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");

    createPlayers();
    createStockDeck();
    createMoneyDeck();

    for(const company of companies){

        giveFiveStocks(company);

        const stockTotal=company.stocks.reduce(
            (sum,s)=>sum+s.value,
            0
        );

        company.cash=5000-stockTotal;
    }

    log("המשחק התחיל!");
    log("כל חברה מתחילה בשווי כולל של 5,000.");

    updateScreen();
    startTurn();
}

/* =========================
   LOG
========================= */

function log(message){

    const box=document.getElementById("log");

    const line=document.createElement("div");

    line.className="logLine";
    line.textContent=message;

    box.appendChild(line);
    box.scrollTop=box.scrollHeight;
}

/* =========================
   קובייה
========================= */

function rollDie(){

    return Math.floor(Math.random()*6)+1;
}

/* =========================
   תחילת תור
========================= */

function startTurn(){

    if(gameOver||roundEnding)return;

    incomeRolled=false;
    lastActionTaken=false;

    const company=companies[currentPlayer];

    updateScreen();

    if(company.bot){

        setTimeout(botTurn,900);

    }else{

        document.getElementById("status").textContent=
            "התור שלך — גלגל להכנסה";
    }
}

/* =========================
   הכנסה
========================= */

function rollIncome(){

    if(incomeRolled)return;
    if(!canHumanActBeforeIncome())return;

    performIncomeRoll();
}

function canHumanActBeforeIncome(){

    if(gameOver||roundEnding)return false;

    return !companies[currentPlayer].bot;
}

function performIncomeRoll(){

    if(incomeRolled||gameOver||roundEnding)return;

    incomeRolled=true;

    const company=companies[currentPlayer];

    const dice=rollDie();

    let income=0;

    for(let i=0;i<dice;i++){

        if(moneyDeck.length===0){

            log("חפיסת הכסף נגמרה עד סוף הסיבוב.");

            break;
        }

        income+=moneyDeck.pop();
    }

    company.cash+=income;

    log(
        company.name+
        " גלגל "+dice+
        " וקיבל "+income+" כסף."
    );

    updateScreen();

    if(company.bot){

        setTimeout(botActions,700);
    }
}

/* =========================
   סימון פעולה
========================= */

function markAction(){

    lastActionTaken=true;
    companies[currentPlayer].nothingTurns=0;
}

/* =========================
   פתיחה / סגירה
========================= */

function toggleStock(stockIndex){

    if(!canHumanAct())return;

    const company=companies[currentPlayer];
    const stock=company.stocks[stockIndex];

    if(!stock)return;

    if(stock.open){

        const openCount=
            company.stocks.filter(s=>s.open).length;

        if(openCount<=1){

            alert("חייבת להיות לפחות מניה אחת פתוחה למכירה.");

            return;
        }

        stock.open=false;

        log(
            company.name+
            " סגר את "+stock.name+
            " למכירה."
        );

    }else{

        stock.open=true;

        log(
            company.name+
            " פתח את "+stock.name+
            " למכירה."
        );
    }

    markAction();
    updateScreen();
}

/* =========================
   מכירה לבנק
========================= */

function sellToBank(stockIndex){

    if(!canHumanAct())return;

    const company=companies[currentPlayer];
    const stock=company.stocks[stockIndex];

    if(!stock)return;

    company.cash+=stock.value;

    company.stocks.splice(stockIndex,1);

    stock.open=false;

    bankStocks.push(stock);

    markAction();

    log(
        company.name+
        " מכר "+stock.name+
        " לבנק ב-"+stock.value+"."
    );

    if(company.stocks.length===0){

        checkRoundEnd();
        return;
    }

    ensureOneOpen(company);

    updateScreen();
}

/* =========================
   מכירת כל המניות לבנק
========================= */

function sellAllToBank(company){

    let total=0;

    while(company.stocks.length>0){

        const stock=company.stocks.pop();

        total+=stock.value;

        stock.open=false;

        bankStocks.push(stock);
    }

    company.cash+=total;

    log(
        company.name+
        " מכר את כל המניות לבנק וקיבל "+total+"."
    );
}

/* =========================
   קנייה
========================= */

function buyStock(sellerIndex,stockIndex){

    if(!canHumanAct())return;

    if(sellerIndex===currentPlayer)return;

    const buyer=companies[currentPlayer];
    const seller=companies[sellerIndex];

    const stock=seller.stocks[stockIndex];

    if(!stock||!stock.open)return;

    /*
       המחיר הנמוך ביותר האפשרי.
       אם אפילו אותו אי אפשר לשלם,
       אין אפשרות להתחיל עסקה.
    */

    const minimumPrice=
        stock.value+
        Math.min(...stock.changes);

    if(buyer.cash<minimumPrice){

        alert(
            "אין לך מספיק כסף אפילו למחיר הנמוך ביותר האפשרי של המניה."
        );

        return;
    }

    /*
       עכשיו ורק עכשיו הקובייה מתגלגלת.
    */

    const dice=rollDie();

    const change=stock.changes[dice-1];

    const price=stock.value+change;

    log(
        "🎲 מחיר "+stock.name+
        " נקבע לפי קובייה: "+
        price
    );

    /*
       אם המחיר שיצא גבוה מדי —
       העסקה מתבטלת.
    */

    if(buyer.cash<price){

        log(
            "❌ העסקה בוטלה! "+
            buyer.name+
            " לא יכול לשלם "+price+"."
        );

        /*
           חשוב:
           לא משנים בעלות ולא כסף.
           המניה נשארת אצל המוכר.
        */

        return;
    }

    /*
       העסקה מתבצעת.
    */

    buyer.cash-=price;
    seller.cash+=price;

    seller.stocks.splice(stockIndex,1);

    stock.open=false;

    buyer.stocks.push(stock);

    markAction();

    log(
        "✅ "+
        buyer.name+
        " קנה "+stock.name+
        " מ-"+seller.name+
        " ב-"+price+"."
    );

    ensureOneOpen(seller);

    checkRoundEnd();

    if(!roundEnding){
        updateScreen();
    }
}

/* =========================
   האם שחקן אנושי יכול לפעול
========================= */

function canHumanAct(){

    if(gameOver||roundEnding)return false;

    if(companies[currentPlayer].bot)return false;

    if(!incomeRolled){

        alert("קודם צריך לגלגל להכנסה.");

        return false;
    }

    return true;
}

/* =========================
   סיום תור
========================= */

function endTurn(){

    if(gameOver||roundEnding)return;

    const company=companies[currentPlayer];

    if(company.bot)return;

    if(!incomeRolled){

        alert("צריך לגלגל להכנסה קודם.");

        return;
    }

    finishCurrentTurn();
}

/* =========================
   סיום תור נוכחי
========================= */

function finishCurrentTurn(){

    const company=companies[currentPlayer];

    if(!lastActionTaken){

        company.nothingTurns++;

        log(
            company.name+
            " לא ביצע פעולה. "+
            "תורות ללא פעולה ברצף: "+
            company.nothingTurns
        );

    }else{

        company.nothingTurns=0;
    }

    /*
       שני תורות בלי לעשות כלום:
       הבנק קונה מניה ב-100 פחות מהבסיס.
    */

    if(
        company.nothingTurns>=2 &&
        company.stocks.length>0
    ){

        bankForcedPurchase(company);

        company.nothingTurns=0;

        if(roundEnding)return;
    }

    nextTurn();
}

/* =========================
   קנייה כפויה מהבנק
========================= */

function bankForcedPurchase(company){

    if(company.stocks.length===0)return;

    /*
       כרגע הבנק לוקח את המניה הראשונה.
    */

    const stock=company.stocks[0];

    const price=Math.max(0,stock.value-100);

    company.cash+=price;

    company.stocks.splice(0,1);

    stock.open=false;

    bankStocks.push(stock);

    log(
        "⚠️ קנס חוסר פעילות: הבנק קנה "+
        stock.name+
        " מ-"+company.name+
        " ב-"+price+
        " — 100 פחות מהמחיר הבסיסי."
    );

    if(company.stocks.length===0){

        checkRoundEnd();
        return;
    }

    ensureOneOpen(company);
}

/* =========================
   תור הבא
========================= */

function nextTurn(){

    if(roundEnding||gameOver)return;

    currentPlayer++;

    if(currentPlayer>=companies.length){

        currentPlayer=0;
        turnNumber++;
    }

    startTurn();
}

/* =========================
   תור בוט
========================= */

function botTurn(){

    if(roundEnding||gameOver)return;

    if(!companies[currentPlayer].bot)return;

    performIncomeRoll();
}

/* =========================
   פעולות בוט
========================= */

function botActions(){

    if(roundEnding||gameOver)return;

    const bot=companies[currentPlayer];

    if(!bot.bot)return;

    let actionDone=false;

    /*
       קודם מנסה לפתוח מניה.
    */

    for(let i=0;i<bot.stocks.length;i++){

        if(
            !bot.stocks[i].open &&
            Math.random()<0.35
        ){

            bot.stocks[i].open=true;

            actionDone=true;

            log(
                bot.name+
                " פתח "+bot.stocks[i].name+
                " למכירה."
            );

            break;
        }
    }

    /*
       מנסה לקנות מניה פתוחה.
    */

    if(!actionDone){

        const possible=[];

        for(
            let sellerIndex=0;
            sellerIndex<companies.length;
            sellerIndex++
        ){

            if(sellerIndex===currentPlayer)continue;

            const seller=companies[sellerIndex];

            for(
                let stockIndex=0;
                stockIndex<seller.stocks.length;
                stockIndex++
            ){

                const stock=seller.stocks[stockIndex];

                if(!stock.open)continue;

                const minimumPrice=
                    stock.value+
                    Math.min(...stock.changes);

                if(bot.cash>=minimumPrice){

                    possible.push({
                        sellerIndex,
                        stockIndex
                    });
                }
            }
        }

        if(possible.length>0){

            const choice=
                possible[
                    Math.floor(
                        Math.random()*possible.length
                    )
                ];

            actionDone=botBuyStock(
                choice.sellerIndex,
                choice.stockIndex
            );
        }
    }

    /*
       אם לא קנה — לפעמים מוכר לבנק.
    */

    if(
        !actionDone &&
        bot.stocks.length>1 &&
        Math.random()<0.5
    ){

        actionDone=botSellToBank(0);
    }

    /*
       לפעמים סוגר מניה,
       אבל לא את המניה הפתוחה היחידה.
    */

    if(!actionDone){

        const openStocks=
            bot.stocks.filter(s=>s.open);

        if(
            openStocks.length>1 &&
            Math.random()<0.3
        ){

            openStocks[0].open=false;

            ensureOneOpen(bot);

            log(
                bot.name+
                " סגר "+openStocks[0].name+
                " למכירה."
            );

            actionDone=true;
        }
    }

    lastActionTaken=actionDone;

    setTimeout(
        finishCurrentTurn,
        700
    );
}

/* =========================
   קניית בוט
========================= */

function botBuyStock(sellerIndex,stockIndex){

    const buyer=companies[currentPlayer];
    const seller=companies[sellerIndex];

    const stock=seller.stocks[stockIndex];

    if(!stock||!stock.open)return false;

    const minimumPrice=
        stock.value+
        Math.min(...stock.changes);

    if(buyer.cash<minimumPrice)return false;

    const dice=rollDie();

    const change=stock.changes[dice-1];

    const price=stock.value+change;

    log(
        "🎲 "+buyer.name+
        " גלגל "+dice+
        " עבור "+stock.name+
        " וקיבל מחיר "+price+"."
    );

    /*
       גם לבוט:
       אם אין מספיק כסף אחרי הקובייה —
       העסקה מתבטלת.
    */

    if(buyer.cash<price){

        log(
            "❌ העסקה של "+buyer.name+
            " בוטלה כי אין לו מספיק כסף."
        );

        return false;
    }

    buyer.cash-=price;
    seller.cash+=price;

    seller.stocks.splice(stockIndex,1);

    stock.open=false;

    buyer.stocks.push(stock);

    log(
        "✅ "+buyer.name+
        " קנה "+stock.name+
        " ב-"+price+
        " מ-"+seller.name+"."
    );

    ensureOneOpen(seller);

    checkRoundEnd();

    return true;
}

/* =========================
   מכירת בוט לבנק
========================= */

function botSellToBank(stockIndex){

    const bot=companies[currentPlayer];

    const stock=bot.stocks[stockIndex];

    if(!stock)return false;

    bot.cash+=stock.value;

    bot.stocks.splice(stockIndex,1);

    stock.open=false;

    bankStocks.push(stock);

    log(
        bot.name+
        " מכר "+stock.name+
        " לבנק ב-"+stock.value+"."
    );

    if(bot.stocks.length===0){

        checkRoundEnd();

        return true;
    }

    ensureOneOpen(bot);

    return true;
}

/* =========================
   בדיקת סוף סיבוב
========================= */

function checkRoundEnd(){

    if(roundEnding||gameOver)return;

    const winnerOfRound=
        companies.find(
            company=>company.stocks.length===0
        );

    if(!winnerOfRound)return;

    roundEnding=true;

    log(
        "================================"
    );

    log(
        "סיבוב "+currentRound+
        " נגמר! "+
        winnerOfRound.name+
        " נשאר בלי מניות."
    );

    setTimeout(showRoundEnd,500);
}

/* =========================
   חלון סוף סיבוב
========================= */

function showRoundEnd(){

    document.getElementById("roundReason").textContent=
        "כל חברה יכולה עכשיו למכור את כל המניות שלה לבנק או לשמור אותן.";

    const buttons=
        document.getElementById("roundChoiceButtons");

    buttons.innerHTML="";

    const player=companies[0];

    if(player.stocks.length===0){

        const text=document.createElement("p");

        text.textContent=
            "אין לך מניות שנשארו למכור.";

        buttons.appendChild(text);

        const continueButton=document.createElement("button");

        continueButton.className="big";

        continueButton.textContent="המשך";

        continueButton.onclick=
            finishRoundForHuman;

        buttons.appendChild(continueButton);

    }else{

        const sell=document.createElement("button");

        sell.className="sell big";

        sell.textContent=
            "מכור את כל המניות לבנק";

        sell.onclick=()=>{

            sellAllToBank(player);

            finishRoundForHuman();
        };

        const keep=document.createElement("button");

        keep.className="keep big";

        keep.textContent=
            "שמור את המניות";

        keep.onclick=
            finishRoundForHuman;

        buttons.appendChild(sell);
        buttons.appendChild(keep);
    }

    document
        .getElementById("roundModal")
        .classList.remove("hidden");
}

/* =========================
   סיום סיבוב
========================= */

function finishRoundForHuman(){

    document
        .getElementById("roundModal")
        .classList.add("hidden");

    /*
       הבוטים מחליטים אוטומטית.
    */

    for(let i=1;i<companies.length;i++){

        const bot=companies[i];

        if(bot.stocks.length===0)continue;

        const stockValue=
            bot.stocks.reduce(
                (sum,s)=>sum+s.value,
                0
            );

        if(
            stockValue>=2000 ||
            Math.random()<0.5
        ){

            sellAllToBank(bot);

        }else{

            log(
                bot.name+
                " שמר את המניות שלו."
            );
        }
    }

    /*
       שמירת תוצאת הסיבוב.
    */

    for(const company of companies){

        company.scoreHistory.push(company.cash);
    }

    /*
       המשחק נגמר?
    */

    if(currentRound>=totalRounds){

        finishGame();

        return;
    }

    /*
       סיבוב חדש.
    */

    currentRound++;
    turnNumber=1;
    currentPlayer=0;

    incomeRolled=false;
    roundEnding=false;
    lastActionTaken=false;

    createMoneyDeck();

    for(const company of companies){

        giveFiveStocks(company);
    }

    log("================================");
    log("סיבוב "+currentRound+" התחיל!");
    log("כל חברה קיבלה 5 מניות חדשות.");
    log("חפיסת הכסף עורבבה מחדש.");

    updateScreen();

    startTurn();
}

/* =========================
   סוף משחק
========================= */

function finishGame(){

    gameOver=true;
    roundEnding=false;

    const sorted=
        [...companies].sort(
            (a,b)=>b.cash-a.cash
        );

    let html="<h3>תוצאות סופיות</h3>";

    sorted.forEach((company,index)=>{

        html+=
            "<p><strong>"+
            (index+1)+
            ". "+
            company.name+
            "</strong> — "+
            company.cash+
            "</p>";
    });

    const winner=sorted[0];

    html+=
        "<hr><h2>🏆 "+
        winner.name+
        " ניצחה!</h2>";

    html+=
        "<p>שווי סופי: "+
        winner.cash+
        "</p>";

    document.getElementById("finalResults").innerHTML=html;

    document
        .getElementById("gameOverModal")
        .classList.remove("hidden");

    log(
        "המשחק נגמר! "+
        winner.name+
        " היא החברה העשירה ביותר."
    );

    updateScreen();
}

/* =========================
   לפחות מניה אחת פתוחה
========================= */

function ensureOneOpen(company){

    if(company.stocks.length===0)return;

    if(!company.stocks.some(s=>s.open)){

        company.stocks[0].open=true;
    }
}

/* =========================
   מסך פעולות
========================= */

function renderActions(){

    const company=companies[currentPlayer];

    const status=document.getElementById("status");
    const buttons=document.getElementById("actionButtons");

    buttons.innerHTML="";

    if(gameOver){

        status.textContent="המשחק נגמר";
        return;
    }

    if(roundEnding){

        status.textContent="הסיבוב מסתיים...";
        return;
    }

    /*
       חשוב:
       בזמן תור בוט אין שום כפתורים
       שהשחקן האנושי יכול להשתמש בהם.
    */

    if(company.bot){

        status.textContent=
            "🤖 "+company.name+
            " משחק...";

        return;
    }

    if(!incomeRolled){

        status.textContent=
            "התור שלך — גלגל להכנסה";

        const roll=document.createElement("button");

        roll.className="big";

        roll.textContent="🎲 גלגל להכנסה";

        roll.onclick=rollIncome;

        buttons.appendChild(roll);

        return;
    }

    status.textContent="התור שלך";

    const end=document.createElement("button");

    end.className="big";

    end.textContent="סיים תור";

    end.onclick=endTurn;

    buttons.appendChild(end);
}

/* =========================
   מסך החברות והמניות
========================= */

function renderCompanies(){

    const container=
        document.getElementById("companies");

    container.innerHTML="";

    companies.forEach((company,companyIndex)=>{

        const box=document.createElement("div");

        box.className="company";

        if(companyIndex===currentPlayer){
            box.classList.add("active");
        }

        const title=document.createElement("h2");

        title.textContent=
            company.name+
            (company.bot?" 🤖":" 👤");

        box.appendChild(title);

        const stats=document.createElement("div");

        stats.className="companyStats";

        const cash=document.createElement("div");

        cash.className="stat cash";

        cash.textContent=
            "כסף: "+company.cash;

        stats.appendChild(cash);

        const count=document.createElement("div");

        count.className="stat";

        count.textContent=
            "מניות: "+company.stocks.length;

        stats.appendChild(count);

        const inactive=document.createElement("div");

        inactive.className="stat";

        inactive.textContent=
            "תורות ללא פעולה: "+
            company.nothingTurns;

        stats.appendChild(inactive);

        box.appendChild(stats);

        const grid=document.createElement("div");

        grid.className="stockGrid";

        company.stocks.forEach(
            (stock,stockIndex)=>{

                const card=document.createElement("div");

                card.className="stock";

                card.classList.add(
                    stock.open?
                    "openStock":
                    "closedStock"
                );

                const name=document.createElement("div");

                name.className="stockName";

                name.textContent=stock.name;

                card.appendChild(name);

                const value=document.createElement("div");

                value.className="stockValue";

                value.textContent=
                    "מחיר בסיס: "+stock.value;

                card.appendChild(value);

                const status=document.createElement("div");

                status.className="stockStatus";

                status.classList.add(
                    stock.open?
                    "openText":
                    "closedText"
                );

                status.textContent=
                    stock.open?
                    "🟢 פתוחה למכירה":
                    "⚪ סגורה";

                card.appendChild(status);

                /*
                   המניות שלך
                */

                if(
                    companyIndex===currentPlayer &&
                    !company.bot &&
                    !roundEnding
                ){

                    const toggle=document.createElement("button");

                    toggle.className=
                        stock.open?
                        "close":
                        "open";

                    toggle.textContent=
                        stock.open?
                        "סגור":
                        "פתח למכירה";

                    toggle.onclick=()=>{
                        toggleStock(stockIndex);
                    };

                    card.appendChild(toggle);

                    const sell=document.createElement("button");

                    sell.className="bank";

                    sell.textContent=
                        "מכור לבנק";

                    sell.onclick=()=>{
                        sellToBank(stockIndex);
                    };

                    card.appendChild(sell);
                }

                /*
                   מניות של אחרים שפתוחות למכירה
                */

                if(
                    companyIndex!==currentPlayer &&
                    stock.open &&
                    !roundEnding &&
                    !companies[currentPlayer].bot &&
                    incomeRolled
                ){

                    /*
                       רק המחיר המינימלי קובע אם
                       בכלל אפשר להתחיל עסקה.
                    */

                    const minimumPrice=
                        stock.value+
                        Math.min(...stock.changes);

                    const buy=document.createElement("button");

                    buy.className="buy";

                    buy.textContent="קנה";

                    /*
                       אם אין מספיק אפילו למחיר
                       המינימלי — אי אפשר להתחיל.
                    */

                    buy.disabled=
                        companies[currentPlayer].cash<
                        minimumPrice;

                    buy.title=
                        "המחיר ייקבע בקובייה";

                    buy.onclick=()=>{
                        buyStock(
                            companyIndex,
                            stockIndex
                        );
                    };

                    card.appendChild(buy);
                }

                grid.appendChild(card);
            }
        );

        box.appendChild(grid);

        container.appendChild(box);
    });
}

/* =========================
   עדכון כל המסך
========================= */

function updateScreen(){

    if(companies.length===0)return;

    document.getElementById("roundDisplay").textContent=
        currentRound;

    document.getElementById("turnDisplay").textContent=
        turnNumber;

    document.getElementById("currentPlayerDisplay").textContent=
        companies[currentPlayer].name;

    document.getElementById("totalRoundsDisplay").textContent=
        totalRounds;

    renderActions();
    renderCompanies();
}

</script>

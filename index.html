<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROCH — Richest Only Come Here</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#dfeaf3;
    color:#17202a;
}

header{
    background:#243b53;
    color:white;
    padding:18px;
    text-align:center;
}

    margin:0 0 5px;
    font-size:34px;
}

header p{
    margin:0;
    opacity:.85;
}

#topBar{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    padding:15px;
    background:#f7fafc;
    border-bottom:1px solid #cbd5e0;
}

.infoBox{
    background:white;
    padding:10px 16px;
    border-radius:10px;
    box-shadow:0 2px 6px #0002;

}

    border:0;
    border-radius:8px;
    padding:9px 13px;

    background:#3182ce;

}

    background:#2b6cb0;
}

    opacity:.45;

}

    background:#e53e3e;
}

button.sell:hover:not(:disabled){
    background:#c53030;
}

button.open{
    background:#38a169;
}

button.close{
    background:#718096;
}

button.buy{

}

}

}

    font-size:18px;

}

#game{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

.company{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 3px 10px #0002;
    border:3px solid transparent;
}

.company.active{
    border-color:#3182ce;
}

.company h2{

}

.companyStats{

}

}

}

.stockGrid{
    display:grid;
    grid-template-columns:repeat(3,minmax(180px,1fr));

}

.stock{

}

.stock.openStock{
    border-color:#38a169;

}

.stock.closedStock{

}

.stockName{

}

.stockValue{
    margin:4px 0;
}

.stockStatus{
    font-size:13px;
    font-weight:bold;

}

.openText{

}

}

.logBox{
    background:#1a202c;

}

.logLine{

}

#actions{

}

#status{
    font-size:20px;

    margin-bottom:10px;
}

.overlay{
    position:fixed;
    inset:0;

}

.modal{

    width:90%;
    text-align:center;
    box-shadow:0 10px 40px #0006;
}

.modal h2{
    margin-top:0;
}

.choiceButtons{
    display:flex;
    justify-content:center;

    flex-wrap:wrap;
}

#startScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.startBox{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 25px #0003;
}

.roundChoice button{
    font-size:20px;
    padding:15px 25px;
}

.hidden{
    display:none !important;
}

@media(max-width:800px){
    .stockGrid{
        grid-template-columns:repeat(2,minmax(150px,1fr));
    }
}

@media(max-width:550px){
    .stockGrid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div id="startScreen">
    <div class="startBox">
        <h1>ROCH</h1>
        <h2>Richest Only Come Here</h2>
        <p>Become the most successful company.</p>

        <h3>Choose number of rounds:</h3>

        <div class="roundChoice">
            <button onclick="startGame(3)">3 Rounds</button>
            <button onclick="startGame(5)">5 Rounds</button>
            <button onclick="startGame(10)">10 Rounds</button>
        </div>
    </div>
</div>

<div id="gameScreen" class="hidden">

<header>
    <h1>ROCH</h1>
    <p>Richest Only Come Here</p>
</header>

<div id="topBar">
    <div class="infoBox">Round: <span id="roundDisplay">1</span></div>
    <div class="infoBox">Turn: <span id="turnDisplay">1</span></div>
    <div class="infoBox">Current: <span id="currentPlayerDisplay"></span></div>
    <div class="infoBox">Rounds: <span id="totalRoundsDisplay"></span></div>
</div>

<div id="game">

    <div id="actions">
        <div id="status"></div>
        <div id="actionButtons"></div>
    </div>

    <div id="companies"></div>

    <div class="logBox" id="log"></div>

</div>

</div>

<div id="roundModal" class="overlay hidden">
    <div class="modal">
        <h2>Round Over!</h2>
        <p id="roundReason"></p>
        <p>
            You may now decide what to do with your remaining stocks.
        </p>

        <div id="roundChoiceButtons" class="choiceButtons"></div>
    </div>
</div>

<div id="gameOverModal" class="overlay hidden">
    <div class="modal">
        <h2>ROCH — Game Over</h2>
        <div id="finalResults"></div>
        <button class="big" onclick="location.reload()">Play Again</button>
    </div>
</div>

<script>

/* =========================================================
   STOCK DEFINITIONS
========================================================= */

const stockTypes = [
    {
        name:"Stock A",
        value:400,
        changes:[-100,-50,0,50,100,200]
    },
    {
        name:"Stock B",
        value:500,
        changes:[-200,-100,-50,50,100,300]
    },
    {
        name:"Stock C",
        value:600,
        changes:[-50,0,50,100,150,200]
    },
    {
        name:"Stock D",
        value:700,
        changes:[-200,-100,0,100,200,400]
    },
    {
        name:"Stock E",
        value:800,
        changes:[-300,-100,0,100,200,500]
    },
    {
        name:"Stock F",
        value:900,
        changes:[-400,-200,-50,100,300,600]
    }
];

/*
    There are multiple physical copies of each stock.
    The pile is shared by everyone.
*/

const STOCK_COPIES = 10;


/* =========================================================
   MONEY DECK
========================================================= */

const MONEY_VALUES = [100,200,300,400,500];

const MONEY_CARDS_PER_VALUE = 30;


/* =========================================================
   GAME STATE
========================================================= */

let totalRounds = 3;
let currentRound = 1;
let turnNumber = 1;

let currentPlayer = 0;

let companies = [];

let stockDeck = [];
let bankStocks = [];

let moneyDeck = [];

let incomeRolled = false;

let roundEnding = false;
let gameOver = false;

let lastActionTaken = false;


/* =========================================================
   CREATE PLAYERS
========================================================= */

function createPlayers(){

    companies = [

        {
            name:"Your Company",
            bot:false,
            cash:0,
            stocks:[],
            nothingTurns:0,
            scoreHistory:[]
        },

        {
            name:"Bot Alpha",
            bot:true,
            cash:0,
            stocks:[],
            nothingTurns:0,
            scoreHistory:[]
        },

        {
            name:"Bot Beta",
            bot:true,
            cash:0,
            stocks:[],
            nothingTurns:0,
            scoreHistory:[]
        },

        {
            name:"Bot Gamma",
            bot:true,
            cash:0,
            stocks:[],
            nothingTurns:0,
            scoreHistory:[]
        }

    ];
}


/* =========================================================
   STOCK DECK
========================================================= */

function createStockDeck(){

    stockDeck = [];

    for(let type of stockTypes){

        for(let i=0;i<STOCK_COPIES;i++){

            stockDeck.push({
                name:type.name,
                value:type.value,
                changes:[...type.changes],
                open:false
            });

        }

    }

    shuffle(stockDeck);
}


/* =========================================================
   MONEY DECK
========================================================= */

function createMoneyDeck(){

    moneyDeck=[];

    for(let value of MONEY_VALUES){

        for(let i=0;i<MONEY_CARDS_PER_VALUE;i++){

            moneyDeck.push(value);

        }

    }

    shuffle(moneyDeck);
}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=[array[j],array[i]];

    }

}


/* =========================================================
   DRAW STOCK
========================================================= */

function drawStock(){

    if(stockDeck.length===0){

        recycleBankStocks();

    }

    if(stockDeck.length===0){
        return null;
    }

    return stockDeck.pop();

}


/* =========================================================
   RECYCLE BANK STOCKS
========================================================= */

function recycleBankStocks(){

    if(bankStocks.length===0){
        return;
    }

    stockDeck.push(...bankStocks);

    bankStocks=[];

    shuffle(stockDeck);

    log("The stock pile was replenished from stocks sold to the bank.");

}


/* =========================================================
   DRAW 5 STOCKS
========================================================= */

function giveFiveStocks(company){

    for(let i=0;i<5;i++){

        const stock=drawStock();

        if(!stock){
            log("There are temporarily no stocks available.");
            break;
        }

        stock.open=false;

        company.stocks.push(stock);

    }

    ensureOneOpen(company);

}


/* =========================================================
   START GAME
========================================================= */

function startGame(rounds){

    totalRounds=rounds;

    currentRound=1;

    turnNumber=1;

    currentPlayer=0;

    roundEnding=false;

    gameOver=false;

    incomeRolled=false;

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");

    createPlayers();

    createStockDeck();

    createMoneyDeck();

    for(let company of companies){

        giveFiveStocks(company);

        let stockTotal=company.stocks.reduce(
            (sum,s)=>sum+s.value,
            0
        );

        company.cash=5000-stockTotal;

    }

    log("Game started!");

    log("Every company begins with a total value of 5,000.");

    updateScreen();

    startTurn();

}


/* =========================================================
   LOG
========================================================= */

function log(message){

    const logBox=document.getElementById("log");

    const line=document.createElement("div");

    line.className="logLine";

    line.textContent=message;

    logBox.appendChild(line);

    logBox.scrollTop=logBox.scrollHeight;

}


/* =========================================================
   DICE
========================================================= */

function rollDie(){

    return Math.floor(Math.random()*6)+1;

}


/* =========================================================
   START TURN
========================================================= */

function startTurn(){

    if(gameOver || roundEnding){
        return;
    }

    incomeRolled=false;

    lastActionTaken=false;

    const company=companies[currentPlayer];

    document.getElementById("status").textContent=
        company.name+"'s turn";

    updateScreen();

    if(company.bot){

        setTimeout(botTurn,900);

    }

}


/* =========================================================
   INCOME
========================================================= */

function rollIncome(){

    if(incomeRolled){
        return;
    }

    if(companies[currentPlayer].bot){
        return;
    }

    performIncomeRoll();

}


/* =========================================================
   PERFORM INCOME ROLL
========================================================= */

function performIncomeRoll(){

    if(incomeRolled || roundEnding || gameOver){
        return;
    }

    incomeRolled=true;

    const company=companies[currentPlayer];

    const dice=rollDie();

    let income=0;

    let cardsDrawn=[];

    for(let i=0;i<dice;i++){

        if(moneyDeck.length===0){

            log("The money deck is empty for this round.");

            break;

        }

        const card=moneyDeck.pop();

        income+=card;

        cardsDrawn.push(card);

    }

    company.cash+=income;

    log(
        company.name+
        " rolled "+dice+
        " and received "+
        income+
        " cash."
    );

    company.nothingTurns=0;

    updateScreen();

    if(company.bot){

        setTimeout(botActions,700);

    }

}


/* =========================================================
   TURN ACTION
========================================================= */

function markAction(){

    lastActionTaken=true;

    companies[currentPlayer].nothingTurns=0;

}


/* =========================================================
   OPEN / CLOSE STOCK
========================================================= */

function toggleStock(stockIndex){

    if(!canHumanAct()){
        return;
    }

    const company=companies[currentPlayer];

    const stock=company.stocks[stockIndex];

    if(!stock){
        return;
    }

    if(stock.open){

        const openCount=
            company.stocks.filter(s=>s.open).length;

        if(openCount<=1){

            alert(
                "You must always have at least one stock open for sale."
            );

            return;

        }

        stock.open=false;

        log(
            company.name+
            " closed "+
            stock.name+
            " for sale."
        );

    }else{

        stock.open=true;

        log(
            company.name+
            " opened "+
            stock.name+
            " for sale."
        );

    }

    markAction();

    updateScreen();

}


/* =========================================================
   ENSURE ONE OPEN
========================================================= */

function ensureOneOpen(company){

    if(company.stocks.length===0){
        return;
    }

    if(!company.stocks.some(s=>s.open)){

        company.stocks[0].open=true;

    }

}


/* =========================================================
   SELL TO BANK
========================================================= */

function sellToBank(stockIndex){

    if(!canHumanAct()){
        return;
    }

    const company=companies[currentPlayer];

    const stock=company.stocks[stockIndex];

    if(!stock){
        return;
    }

    company.cash+=stock.value;

    company.stocks.splice(stockIndex,1);

    stock.open=false;

    bankStocks.push(stock);

    markAction();

    log(
        company.name+
        " sold "+
        stock.name+
        " to the bank for "+
        stock.value+"."
    );

    checkRoundEnd();

    if(!roundEnding){
        ensureOneOpen(company);
        updateScreen();
    }

}


/* =========================================================
   SELL ALL TO BANK
   USED AT ROUND END
========================================================= */

function sellAllToBank(company){

    let total=0;

    while(company.stocks.length>0){

        const stock=company.stocks.pop();

        total+=stock.value;

        stock.open=false;

        bankStocks.push(stock);

    }

    company.cash+=total;

    log(
        company.name+
        " sold all remaining stocks to the bank for "+
        total+"."
    );

}


/* =========================================================
   BUY STOCK
========================================================= */

function buyStock(sellerIndex,stockIndex){

    if(!canHumanAct()){
        return;
    }

    if(sellerIndex===currentPlayer){
        return;
    }

    const buyer=companies[currentPlayer];

    const seller=companies[sellerIndex];

    const stock=seller.stocks[stockIndex];

    if(!stock){
        return;
    }

    if(!stock.open){
        return;
    }

    /*
        We check whether the buyer can afford the worst
        possible price before rolling.
        This prevents a forced impossible purchase.
    */

    const maximumPrice=
        stock.value+
        Math.max(...stock.changes);

    if(buyer.cash<maximumPrice){

        alert(
            "You cannot buy this stock because you cannot afford its maximum possible price."
        );

        return;

    }

    const dice=rollDie();

    const change=stock.changes[dice-1];

    const price=stock.value+change;

    /*
        Buyer MUST buy after the roll.
    */

    buyer.cash-=price;

    seller.cash+=price;

    seller.stocks.splice(stockIndex,1);

    stock.open=false;

    buyer.stocks.push(stock);

    markAction();

    log(
        buyer.name+
        " bought "+
        stock.name+
        " from "+
        seller.name+
        " for "+
        price+
        " (roll "+dice+")."
    );

    ensureOneOpen(seller);

    checkRoundEnd();

    if(!roundEnding){

        updateScreen();

    }

}


/* =========================================================
   HUMAN CAN ACT?
========================================================= */

function canHumanAct(){

    if(gameOver || roundEnding){
        return false;
    }

    if(companies[currentPlayer].bot){
        return false;
    }

    if(!incomeRolled){

        alert("Roll for income first.");

        return false;

    }

    return true;

}


/* =========================================================
   END TURN
========================================================= */

function endTurn(){

    if(gameOver || roundEnding){
        return;
    }

    const company=companies[currentPlayer];

    if(company.bot){
        return;
    }

    if(!incomeRolled){

        alert("You must roll for income first.");

        return;

    }

    finishCurrentTurn();

}


/* =========================================================
   FINISH CURRENT TURN
========================================================= */

function finishCurrentTurn(){

    const company=companies[currentPlayer];

    /*
        A turn with no action means:
        income happened, but the player did not buy,
        sell, open, or close anything.
    */

    if(!lastActionTaken){

        company.nothingTurns++;

        log(
            company.name+
            " took no action this turn. "+
            company.nothingTurns+
            " consecutive inactive turn(s)."
        );

    }else{

        company.nothingTurns=0;

    }

    /*
        After TWO consecutive inactive turns,
        the bank automatically buys ONE stock
        for 100 less than its base value.
    */

    if(company.nothingTurns>=2 && company.stocks.length>0){

        bankForcedPurchase(company);

        company.nothingTurns=0;

        if(roundEnding){
            return;
        }

    }

    nextTurn();

}


/* =========================================================
   BANK FORCED PURCHASE
========================================================= */

function bankForcedPurchase(company){

    if(company.stocks.length===0){
        return;
    }

    /*
        If there are several stocks, the bank buys
        the first stock in the company's list.
    */

    const stock=company.stocks[0];

    const price=Math.max(0,stock.value-100);

    company.cash+=price;

    company.stocks.splice(0,1);

    stock.open=false;

    bankStocks.push(stock);

    log(
        "INACTIVITY PENALTY: The bank bought "+
        stock.name+
        " from "+
        company.name+
        " for "+
        price+
        " (100 below base value)."
    );

    if(company.stocks.length===0){

        checkRoundEnd();

        return;

    }

    ensureOneOpen(company);

    updateScreen();

}


/* =========================================================
   NEXT TURN
========================================================= */

function nextTurn(){

    if(roundEnding || gameOver){
        return;
    }

    currentPlayer++;

    if(currentPlayer>=companies.length){

        currentPlayer=0;

        turnNumber++;

    }

    startTurn();

}


/* =========================================================
   BOT TURN
========================================================= */

function botTurn(){

    if(roundEnding || gameOver){
        return;
    }

    if(!companies[currentPlayer].bot){
        return;
    }

    performIncomeRoll();

}


/* =========================================================
   BOT ACTIONS
========================================================= */

function botActions(){

    if(roundEnding || gameOver){
        return;
    }

    const bot=companies[currentPlayer];

    if(!bot.bot){
        return;
    }

    let actionDone=false;

    /*
        Simple AI:
        1. Try to sell a stock to the bank if it needs cash.
        2. Try to buy a stock it can afford.
        3. Sometimes open/close stocks.
        4. Otherwise do nothing.
    */

    /*
        Open stocks that are closed.
    */

    for(let i=0;i<bot.stocks.length;i++){

        if(!bot.stocks[i].open && Math.random()<0.35){

            bot.stocks[i].open=true;

            actionDone=true;

            log(
                bot.name+
                " opened "+
                bot.stocks[i].name+
                " for sale."
            );

            break;

        }

    }


    /*
        Try buying an opponent stock.
    */

    if(!actionDone){

        const possible=[];

        for(let sellerIndex=0;
            sellerIndex<companies.length;
            sellerIndex++){

            if(sellerIndex===currentPlayer){
                continue;
            }

            const seller=companies[sellerIndex];

            for(let stockIndex=0;
                stockIndex<seller.stocks.length;
                stockIndex++){

                const stock=seller.stocks[stockIndex];

                if(!stock.open){
                    continue;
                }

                const maximum=
                    stock.value+
                    Math.max(...stock.changes);

                if(bot.cash>=maximum){

                    possible.push({
                        sellerIndex,
                        stockIndex,
                        stock
                    });

                }

            }

        }

        if(possible.length>0){

            /*
                Randomly choose an affordable open stock.
            */

            const choice=
                possible[
                    Math.floor(
                        Math.random()*possible.length
                    )
                ];

            botBuyStock(
                choice.sellerIndex,
                choice.stockIndex
            );

            actionDone=true;

        }

    }


    /*
        If bot did nothing, sometimes sell a stock
        to the bank.
    */

    if(!actionDone && bot.stocks.length>1){

        if(Math.random()<0.45){

            botSellToBank(0);

            actionDone=true;

        }

    }


    /*
        Sometimes close an open stock, but never the last one.
    */

    if(!actionDone){

        const openStocks=
            bot.stocks.filter(s=>s.open);

        if(
            openStocks.length>1 &&
            Math.random()<0.3
        ){

            const stock=openStocks[0];

            stock.open=false;

            ensureOneOpen(bot);

            log(
                bot.name+
                " closed "+
                stock.name+
                " for sale."
            );

            actionDone=true;

        }

    }


    /*
        Finish bot turn.
    */

    lastActionTaken=actionDone;

    setTimeout(()=>{

        finishCurrentTurn();

    },700);

}


/* =========================================================
   BOT BUY
========================================================= */

function botBuyStock(sellerIndex,stockIndex){

    const buyer=companies[currentPlayer];

    const seller=companies[sellerIndex];

    const stock=seller.stocks[stockIndex];

    if(!stock || !stock.open){
        return false;
    }

    const maximum=
        stock.value+
        Math.max(...stock.changes);

    if(buyer.cash<maximum){
        return false;
    }

    const dice=rollDie();

    const change=stock.changes[dice-1];

    const price=stock.value+change;

    buyer.cash-=price;

    seller.cash+=price;

    seller.stocks.splice(stockIndex,1);

    stock.open=false;

    buyer.stocks.push(stock);

    ensureOneOpen(seller);

    log(
        buyer.name+
        " bought "+
        stock.name+
        " from "+
        seller.name+
        " for "+
        price+
        " (roll "+dice+")."
    );

    checkRoundEnd();

    return true;

}


/* =========================================================
   BOT SELL TO BANK
========================================================= */

function botSellToBank(stockIndex){

    const bot=companies[currentPlayer];

    const stock=bot.stocks[stockIndex];

    if(!stock){
        return false;
    }

    bot.cash+=stock.value;

    bot.stocks.splice(stockIndex,1);

    stock.open=false;

    bankStocks.push(stock);

    log(
        bot.name+
        " sold "+
        stock.name+
        " to the bank for "+
        stock.value+"."
    );

    if(bot.stocks.length===0){

        checkRoundEnd();

        return true;

    }

    ensureOneOpen(bot);

    return true;

}


/* =========================================================
   CHECK ROUND END
========================================================= */

function checkRoundEnd(){

    if(roundEnding || gameOver){
        return;
    }

    const winnerOfRound=
        companies.find(c=>c.stocks.length===0);

    if(!winnerOfRound){
        return;
    }

    roundEnding=true;

    log(
        "ROUND "+currentRound+
        " ENDED because "+
        winnerOfRound.name+
        " has no stocks left."
    );

    setTimeout(showRoundEnd,500);

}


/* =========================================================
   ROUND END
========================================================= */

function showRoundEnd(){

    document.getElementById("roundReason").textContent=
        "A company has sold all of its stocks. Now every company may sell ALL of its remaining stocks to the bank or keep them.";

    const buttons=
        document.getElementById("roundChoiceButtons");

    buttons.innerHTML="";

    /*
        If user has stocks, let them choose.
        If user has none, automatically continue.
    */

    const player=companies[0];

    if(player.stocks.length===0){

        const text=document.createElement("p");

        text.textContent=
            "You have no stocks left, so you cannot sell anything else.";

        buttons.appendChild(text);

        const b=document.createElement("button");

        b.className="big";

        b.textContent="Continue";

        b.onclick=finishRoundForHuman;

        buttons.appendChild(b);

    }else{

        const sell=document.createElement("button");

        sell.className="sell big";

        sell.textContent="Sell ALL my stocks to the bank";

        sell.onclick=()=>{

            sellAllToBank(player);

            finishRoundForHuman();

        };

        const keep=document.createElement("button");

        keep.className="keep big";

        keep.textContent="Keep my stocks";

        keep.onclick=finishRoundForHuman;

        buttons.appendChild(sell);

        buttons.appendChild(keep);

    }

    document
        .getElementById("roundModal")
        .classList.remove("hidden");

}


/* =========================================================
   HUMAN FINISH ROUND
========================================================= */

function finishRoundForHuman(){

    document
        .getElementById("roundModal")
        .classList.add("hidden");

    /*
        Bots choose automatically.
        Their decision is intentionally simple for now.
    */

    for(let i=1;i<companies.length;i++){

        const bot=companies[i];

        if(bot.stocks.length===0){
            continue;
        }

        /*
            Bots are more likely to cash out
            when they have a lot of stocks.
        */

        const stockValue=
            bot.stocks.reduce(
                (sum,s)=>sum+s.value,
                0
            );

        if(stockValue>=2000 || Math.random()<0.5){

            sellAllToBank(bot);

        }else{

            log(
                bot.name+
                " kept its remaining stocks."
            );

        }

    }

    /*
        Save score of this round.
    */

    for(let company of companies){

        company.scoreHistory.push(company.cash);

    }

    /*
        If this was the final round,
        finish the game.
    */

    if(currentRound>=totalRounds){

        finishGame();

        return;

    }

    /*
        Otherwise start next round.
    */

    currentRound++;

    turnNumber=1;

    currentPlayer=0;

    incomeRolled=false;

    roundEnding=false;

    lastActionTaken=false;

    /*
        Reshuffle money deck.
    */

    createMoneyDeck();

    /*
        Every company gets 5 new random stocks.
    */

    for(let company of companies){

        giveFiveStocks(company);

    }

    log("================================");

    log(
        "ROUND "+
        currentRound+
        " BEGINS!"
    );

    log(
        "Every company received 5 new stocks."
    );

    log(
        "The money deck was reshuffled."
    );

    updateScreen();

    startTurn();

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    gameOver=true;

    roundEnding=false;

    updateScreen();

    const sorted=
        [...companies].sort(
            (a,b)=>b.cash-a.cash
        );

    let html="";

    html+="<h3>Final Results</h3>";

    sorted.forEach((company,index)=>{

        html+=
            "<p><strong>"+
            (index+1)+
            ". "+
            company.name+
            "</strong> — "+
            company.cash+
            " cash</p>";

    });

    const winner=sorted[0];

    html+=
        "<hr><h2>"+
        winner.name+
        " WINS!</h2>";

    html+=
        "<p>"+
        "Final wealth: "+
        winner.cash+
        "</p>";

    document.getElementById("finalResults").innerHTML=html;

    document
        .getElementById("gameOverModal")
        .classList.remove("hidden");

    log(
        "GAME OVER! "+
        winner.name+
        " is the richest company!"
    );

}


/* =========================================================
   RENDER SCREEN
========================================================= */

function updateScreen(){

    if(companies.length===0){
        return;
    }

    document.getElementById("roundDisplay").textContent=
        currentRound;

    document.getElementById("turnDisplay").textContent=
        turnNumber;

    document.getElementById("currentPlayerDisplay").textContent=
        companies[currentPlayer].name;

    document.getElementById("totalRoundsDisplay").textContent=
        totalRounds;

    renderActions();

    renderCompanies();

}


/* =========================================================
   RENDER ACTIONS
========================================================= */

function renderActions(){

    const company=companies[currentPlayer];

    const status=document.getElementById("status");

    const buttons=document.getElementById("actionButtons");

    buttons.innerHTML="";

    if(gameOver){

        status.textContent="Game Over";

        return;

    }

    if(roundEnding){

        status.textContent="Round ending...";

        return;

    }

    if(company.bot){

        status.textContent=
            "🤖 "+company.name+
            " is thinking...";

        /*
            No buttons for human while bot is active.
        */

        return;

    }

    status.textContent=
        "Your turn";

    if(!incomeRolled){

        const roll=document.createElement("button");

        roll.className="big";

        roll.textContent="🎲 ROLL FOR INCOME";

        roll.onclick=rollIncome;

        buttons.appendChild(roll);

        return;

    }

    const end=document.createElement("button");

    end.className="big";

    end.textContent="END TURN";

    end.onclick=endTurn;

    buttons.appendChild(end);

}


/* =========================================================
   RENDER COMPANIES
========================================================= */

function renderCompanies(){

    const container=
        document.getElementById("companies");

    container.innerHTML="";

    companies.forEach((company,companyIndex)=>{

        const box=document.createElement("div");

        box.className="company";

        if(companyIndex===currentPlayer){

            box.classList.add("active");

        }

        const title=document.createElement("h2");

        title.textContent=
            company.name+
            (company.bot ? " 🤖" : " 👤");

        box.appendChild(title);

        const stats=document.createElement("div");

        stats.className="companyStats";

        const cash=document.createElement("div");

        cash.className="stat cash";

        cash.textContent=
            "Cash: "+company.cash;

        stats.appendChild(cash);

        const stockCount=document.createElement("div");

        stockCount.className="stat";

        stockCount.textContent=
            "Stocks: "+company.stocks.length;

        stats.appendChild(stockCount);

        const inactive=document.createElement("div");

        inactive.className="stat";

        inactive.textContent=
            "Inactive turns: "+company.nothingTurns;

        stats.appendChild(inactive);

        box.appendChild(stats);

        const grid=document.createElement("div");

        grid.className="stockGrid";

        company.stocks.forEach((stock,stockIndex)=>{

            const card=document.createElement("div");

            card.className="stock";

            card.classList.add(
                stock.open ?
                "openStock" :
                "closedStock"
            );

            const name=document.createElement("div");

            name.className="stockName";

            name.textContent=stock.name;

            card.appendChild(name);

            const value=document.createElement("div");

            value.className="stockValue";

            value.textContent=
                "Base value: "+stock.value;

            card.appendChild(value);

            const status=document.createElement("div");

            status.className="stockStatus";

            status.classList.add(
                stock.open ?
                "openText" :
                "closedText"
            );

            status.textContent=
                stock.open ?
                "OPEN FOR SALE" :
                "NOT FOR SALE";

            card.appendChild(status);


            /*
                Current player's own stocks.
            */

            if(
                companyIndex===currentPlayer &&
                !company.bot &&
                !roundEnding
            ){

                const toggle=document.createElement("button");

                toggle.className=
                    stock.open ?
                    "close" :
                    "open";

                toggle.textContent=
                    stock.open ?
                    "CLOSE" :
                    "OPEN FOR SALE";

                toggle.onclick=()=>{
                    toggleStock(stockIndex);
                };

                card.appendChild(toggle);


                const sell=document.createElement("button");

                sell.className="bank";

                sell.textContent=
                    "SELL TO BANK";

                sell.onclick=()=>{
                    sellToBank(stockIndex);
                };

                card.appendChild(sell);

            }


            /*
                Open stocks belonging to another player.
            */

            if(
                companyIndex!==currentPlayer &&
                stock.open &&
                !roundEnding &&
                !company.bot &&
                companies[currentPlayer] &&
                !companies[currentPlayer].bot &&
                incomeRolled
            ){

                const maximum=
                    stock.value+
                    Math.max(...stock.changes);

                const buy=document.createElement("button");

                buy.className="buy";

                buy.textContent=
                    "BUY";

                /*
                    Buyer must be able to afford
                    the maximum possible price.
                */

                buy.disabled=
                    companies[currentPlayer].cash<
                    maximum;

                buy.onclick=()=>{
                    buyStock(
                        companyIndex,
                        stockIndex
                    );
                };

                card.appendChild(buy);

            }

            grid.appendChild(card);

        });

        box.appendChild(grid);

        container.appendChild(box);

    });

}


/* =========================================================
   INITIAL SCREEN
========================================================= */

</script>

</body>

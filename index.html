<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ROCH — Richest Only Come Here</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#dcecf7;
    color:#17212b;
}

button{
    font-family:inherit;
    cursor:pointer;
}

header{
    background:#173f5f;
    color:white;
    padding:16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px #0003;
}

header h1{
    margin:0;
    font-size:28px;
}

#topInfo{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    font-weight:bold;
}

.screen{
    padding:18px;
    max-width:1500px;
    margin:auto;
}

.hidden{
    display:none!important;
}

/* START */

#startScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#dcecf7;
}

.startBox{
    background:white;
    padding:40px;
    border-radius:20px;
    width:min(600px,90%);
    text-align:center;
    box-shadow:0 8px 30px #0002;
}

.startBox h1{
    font-size:50px;
    margin:0 0 5px;
    color:#173f5f;
}

.startBox p{
    color:#555;
}

.roundButtons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:30px;
    flex-wrap:wrap;
}

.roundButtons button{
    padding:16px 30px;
    border:0;
    border-radius:12px;
    background:#2f80ed;
    color:white;
    font-size:20px;
    font-weight:bold;
}

.roundButtons button:hover{
    background:#1967c5;
}

/* BOARD */

.board{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.company{
    background:white;
    border-radius:16px;
    padding:15px;
    box-shadow:0 3px 12px #0002;
    border:3px solid transparent;
}

.company.current{
    border-color:#2f80ed;
    box-shadow:0 0 0 3px #2f80ed33,0 4px 15px #0002;
}

.company.bot{
    background:#f9fbfd;
}

.companyHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.companyHeader h2{
    margin:0;
}

.cash{
    font-size:20px;
    font-weight:bold;
    color:#19713a;
}

.stockArea{
    margin-top:12px;
}

.stock{
    background:#f4f7fa;
    border:2px solid #b7c6d2;
    border-radius:10px;
    padding:9px;
    margin-bottom:7px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.stock.open{
    border-color:#f2994a;
    background:#fff6ed;
}

.stockInfo{
    text-align:right;
}

.stockName{
    font-weight:bold;
    font-size:17px;
}

.stockBase{
    font-size:13px;
    color:#666;
}

.openBadge{
    color:#b65300;
    font-weight:bold;
    font-size:13px;
}

#actionPanel{
    margin-top:16px;
    background:white;
    padding:16px;
    border-radius:16px;
    box-shadow:0 3px 12px #0002;
}

#actionPanel h2{
    margin-top:0;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.actions button{
    border:0;
    padding:10px 14px;
    border-radius:9px;
    background:#2f80ed;
    color:white;
    font-weight:bold;
}

.actions button:hover:not(:disabled){
    background:#1769c2;
}

.actions button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

#turnStatus{
    margin-bottom:10px;
    font-weight:bold;
}

/* LOG */

#logPanel{
    margin-top:16px;
    background:#101820;
    color:#e9f3fa;
    border-radius:16px;
    padding:16px;
    box-shadow:0 3px 12px #0003;
}

#logPanel h2{
    margin-top:0;
    color:white;
}

#gameLog{
    height:300px;
    overflow-y:auto;
    background:#071018;
    border-radius:10px;
    padding:10px;
    font-family:Consolas,monospace;
    font-size:14px;
}

.logLine{
    padding:7px 4px;
    border-bottom:1px solid #ffffff12;
}

.logLine strong{
    color:#fff;
}

.logGood{
    color:#7ee787;
}

.logBad{
    color:#ff8f8f;
}

.logInfo{
    color:#8ecbff;
}

.logMoney{
    color:#ffd866;
}

/* MODAL */

.modalOverlay{
    position:fixed;
    inset:0;
    background:#0008;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.modal{
    background:white;
    width:min(650px,90%);
    max-height:90vh;
    overflow:auto;
    border-radius:18px;
    padding:25px;
    box-shadow:0 10px 40px #0005;
}

.modal h2{
    margin-top:0;
    color:#173f5f;
}

.modalButtons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.modalButtons button{
    border:0;
    padding:12px 18px;
    border-radius:10px;
    background:#2f80ed;
    color:white;
    font-weight:bold;
}

.modalButtons button.secondary{
    background:#777;
}

.resultsTable{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

.resultsTable th,
.resultsTable td{
    border:1px solid #ccd6df;
    padding:9px;
    text-align:center;
}

.resultsTable th{
    background:#edf4f9;
}

/* RESPONSIVE */

@media(max-width:850px){
    .board{
        grid-template-columns:1fr;
    }

    header{
        flex-direction:column;
        gap:10px;
    }
}
</style>
</head>

<body>

<!-- START SCREEN -->
<div id="startScreen">

    <div class="startBox">

        <h1>ROCH</h1>

        <h2>Richest Only Come Here</h2>

        <p>
            אתה מנהל חברה ומתחרה מול 3 חברות מחשב.
            קנה מניות, מכור, פתח וסגור מניות למסחר,
            וצבור כמה שיותר כסף.
        </p>

        <h3>כמה סיבובים?</h3>

        <div class="roundButtons">
            <button onclick="startGame(3)">3 סיבובים</button>
            <button onclick="startGame(5)">5 סיבובים</button>
            <button onclick="startGame(10)">10 סיבובים</button>
        </div>

    </div>

</div>


<!-- GAME -->
<div id="gameScreen" class="hidden">

<header>

    <h1>ROCH</h1>

    <div id="topInfo">
        <span id="roundInfo"></span>
        <span id="turnInfo"></span>
        <span id="currentInfo"></span>
    </div>

</header>


<div class="screen">

    <div id="board" class="board"></div>

    <div id="actionPanel">

        <h2>פעולות</h2>

        <div id="turnStatus"></div>

        <div id="actions" class="actions"></div>

    </div>


    <div id="logPanel">

        <h2>📜 יומן המשחק</h2>

        <div id="gameLog"></div>

    </div>

</div>

</div>


<!-- MODAL -->
<div id="modalOverlay" class="modalOverlay hidden">

    <div id="modal" class="modal"></div>

</div>


<script>

/* =========================================================
   STOCK TYPES
========================================================= */

const stockTypes = [

    {
        id:"A",
        name:"מניית A",
        base:400,
        changes:[-100,-50,0,50,100,200]
    },

    {
        id:"B",
        name:"מניית B",
        base:500,
        changes:[-200,-100,-50,50,100,300]
    },

    {
        id:"C",
        name:"מניית C",
        base:600,
        changes:[-50,0,50,100,150,200]
    },

    {
        id:"D",
        name:"מניית D",
        base:700,
        changes:[-200,-100,0,100,200,400]
    },

    {
        id:"E",
        name:"מניית E",
        base:800,
        changes:[-300,-100,0,100,200,500]
    },

    {
        id:"F",
        name:"מניית F",
        base:900,
        changes:[-400,-200,-50,100,300,600]
    }

];


/* =========================================================
   MONEY
========================================================= */

const moneyValues = [
    100,
    200,
    300,
    400,
    500
];


/* =========================================================
   GAME VARIABLES
========================================================= */

let players = [];

let stockDeck = [];

let bankStocks = [];

let moneyDeck = [];

let totalRounds = 3;

let currentRound = 1;

let currentPlayer = 0;

let turnNumber = 1;

let gameOver = false;


/* =========================================================
   UTILITIES
========================================================= */

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=[array[j],array[i]];

    }

    return array;
}


function formatMoney(value){

    return "$" + value.toLocaleString("en-US");

}


function formatChange(change){

    if(change > 0){
        return `<span class="logGood">📈 עלייה של ${formatMoney(change)}</span>`;
    }

    if(change < 0){
        return `<span class="logBad">📉 ירידה של ${formatMoney(Math.abs(change))}</span>`;
    }

    return `<span class="logInfo">⚪ ללא שינוי</span>`;
}


function playerName(player){

    return player.name;
}


/* =========================================================
   LOG
========================================================= */

function log(message,className=""){

    const container=document.getElementById("gameLog");

    const line=document.createElement("div");

    line.className="logLine "+className;

    const time=new Date().toLocaleTimeString("he-IL",{
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
    });

    line.innerHTML=`<span style="opacity:.45">[${time}]</span> ${message}`;

    container.appendChild(line);

    container.scrollTop=container.scrollHeight;

}


/* =========================================================
   CREATE PLAYERS
========================================================= */

function createPlayers(){

    players=[

        {
            id:0,
            name:"החברה שלך",
            isBot:false,
            cash:5000,
            stocks:[],
            openStocks:new Set(),
            inactiveTurns:0
        },

        {
            id:1,
            name:"BOT 1",
            isBot:true,
            cash:5000,
            stocks:[],
            openStocks:new Set(),
            inactiveTurns:0
        },

        {
            id:2,
            name:"BOT 2",
            isBot:true,
            cash:5000,
            stocks:[],
            openStocks:new Set(),
            inactiveTurns:0
        },

        {
            id:3,
            name:"BOT 3",
            isBot:true,
            cash:5000,
            stocks:[],
            openStocks:new Set(),
            inactiveTurns:0
        }

    ];

}


/* =========================================================
   STOCK DECK
========================================================= */

function createStockDeck(){

    stockDeck=[];

    /*
       10 עותקים מכל סוג.
       אם נגמרת החפיסה, מניות שנמכרו לבנק
       חוזרות לחפיסה.
    */

    for(const type of stockTypes){

        for(let i=0;i<10;i++){

            stockDeck.push({
                uid:crypto.randomUUID(),
                typeId:type.id,
                name:type.name,
                base:type.base,
                changes:[...type.changes],
                owner:null,
                open:false
            });

        }

    }

    shuffle(stockDeck);

}


/* =========================================================
   MONEY DECK
========================================================= */

function createMoneyDeck(){

    moneyDeck=[];

    for(const value of moneyValues){

        for(let i=0;i<30;i++){

            moneyDeck.push(value);

        }

    }

    shuffle(moneyDeck);

}


/* =========================================================
   DRAW STOCK
========================================================= */

function drawStock(){

    if(stockDeck.length===0){

        recycleBankStocks();

    }

    if(stockDeck.length===0){

        return null;

    }

    return stockDeck.pop();

}


/* =========================================================
   RECYCLE BANK STOCKS
========================================================= */

function recycleBankStocks(){

    if(bankStocks.length===0){
        return;
    }

    for(const stock of bankStocks){

        stock.owner=null;
        stock.open=false;

        stockDeck.push(stock);

    }

    bankStocks=[];

    shuffle(stockDeck);

    log("♻️ הבנק החזיר את המניות שנמכרו אליו לחפיסת המניות.","logInfo");

}


/* =========================================================
   GIVE FIVE STOCKS
========================================================= */

function giveFiveStocks(player){

    for(let i=0;i<5;i++){

        const stock=drawStock();

        if(!stock) break;

        stock.owner=player.id;
        stock.open=false;

        player.stocks.push(stock);

    }

}


/* =========================================================
   START GAME
========================================================= */

function startGame(rounds){

    totalRounds=rounds;

    currentRound=1;

    currentPlayer=0;

    turnNumber=1;

    gameOver=false;

    document.getElementById("startScreen").classList.add("hidden");

    document.getElementById("gameScreen").classList.remove("hidden");

    createPlayers();

    createStockDeck();

    createMoneyDeck();

    for(const player of players){

        player.stocks=[];

        player.openStocks=new Set();

        player.cash=5000;

        player.inactiveTurns=0;

        giveFiveStocks(player);

    }

    ensureOneOpenForAll();

    document.getElementById("gameLog").innerHTML="";

    log(`🚀 המשחק התחיל! ${totalRounds} סיבובים.`,"logInfo");

    for(const player of players){

        log(
            `🏢 <strong>${player.name}</strong> התחיל עם
            💰 ${formatMoney(player.cash)}
            ו-${player.stocks.length} מניות.`,
            "logInfo"
        );

    }

    log("🎯 המטרה: לסיים עם הכי הרבה כסף.","logInfo");

    updateScreen();

    startTurn();

}


/* =========================================================
   ENSURE OPEN STOCK
========================================================= */

function ensureOneOpen(player){

    if(player.stocks.length===0) return;

    const openCount=player.stocks.filter(s=>s.open).length;

    if(openCount===0){

        const stock=player.stocks[0];

        stock.open=true;

        player.openStocks.add(stock.uid);

    }

}


function ensureOneOpenForAll(){

    for(const player of players){

        ensureOneOpen(player);

    }

}


/* =========================================================
   TURN
========================================================= */

function startTurn(){

    if(gameOver) return;

    const player=players[currentPlayer];

    updateScreen();

    log(
        `▶️ <strong>התור של ${player.name}</strong> התחיל.`,
        "logInfo"
    );

    if(player.isBot){

        setTimeout(()=>{

            performIncomeRoll(player);

            setTimeout(()=>botTurn(player),500);

        },500);

    }else{

        performIncomeRoll(player);

    }

}


/* =========================================================
   INCOME
========================================================= */

function performIncomeRoll(player){

    if(moneyDeck.length===0){

        log(
            `💰 חפיסת הכסף נגמרה. ${player.name} לא מקבל כסף בתור הזה.`,
            "logBad"
        );

        return;

    }

    const die=rollDie();

    const drawn=[];

    let total=0;

    for(let i=0;i<die;i++){

        if(moneyDeck.length===0){

            break;

        }

        const card=moneyDeck.pop();

        drawn.push(card);

        total+=card;

    }

    player.cash+=total;

    const cardsText=drawn.map(v=>formatMoney(v)).join(" + ");

    log(
        `🎲 <strong>${player.name}</strong> גלגל/ה לקבלת הכנסה:
        <strong>${die}</strong> קלפי כסף.`,
        "logInfo"
    );

    log(
        `🃏 קלפי הכסף: <strong>${cardsText || "אין"}</strong>`,
        "logMoney"
    );

    log(
        `💵 <strong>${player.name}</strong> קיבל/ה בסך הכול
        <strong>${formatMoney(total)}</strong>.
        💰 כסף עכשיו: <strong>${formatMoney(player.cash)}</strong>`,
        "logMoney"
    );

    updateScreen();

}


/* =========================================================
   DIE
========================================================= */

function rollDie(){

    return Math.floor(Math.random()*6)+1;

}


/* =========================================================
   ACTION TRACKING
========================================================= */

function markAction(player){

    player.inactiveTurns=0;

}


/* =========================================================
   TOGGLE STOCK
========================================================= */

function toggleStock(stockUid){

    const player=players[currentPlayer];

    if(player.isBot) return;

    const stock=player.stocks.find(s=>s.uid===stockUid);

    if(!stock) return;

    if(stock.open){

        const openCount=player.stocks.filter(s=>s.open).length;

        if(openCount<=1){

            log(
                `⚠️ אי אפשר לסגור את ${stock.name}: זו המניה הפתוחה היחידה של ${player.name}.`,
                "logBad"
            );

            return;

        }

        stock.open=false;

        player.openStocks.delete(stock.uid);

        markAction(player);

        log(
            `🔒 ${player.name} סגר את ${stock.name} למסחר.`,
            "logInfo"
        );

    }else{

        stock.open=true;

        player.openStocks.add(stock.uid);

        markAction(player);

        log(
            `🔓 ${player.name} פתח את ${stock.name} למסחר.`,
            "logInfo"
        );

    }

    ensureOneOpen(player);

    updateScreen();

}


/* =========================================================
   SELL TO BANK
========================================================= */

function sellToBank(stockUid){

    const player=players[currentPlayer];

    if(player.isBot) return;

    const index=player.stocks.findIndex(s=>s.uid===stockUid);

    if(index===-1) return;

    const stock=player.stocks[index];

    const value=stock.base;

    player.cash+=value;

    player.stocks.splice(index,1);

    player.openStocks.delete(stock.uid);

    stock.owner=null;

    stock.open=false;

    bankStocks.push(stock);

    markAction(player);

    log(
        `🏦 ${player.name} מכר לבנק את <strong>${stock.name}</strong>
        במחיר הבסיס <strong>${formatMoney(value)}</strong>.
        💰 כסף עכשיו: <strong>${formatMoney(player.cash)}</strong>`,
        "logMoney"
    );

    ensureOneOpen(player);

    checkRoundEnd();

    updateScreen();

}


/* =========================================================
   SELL ALL
========================================================= */

function sellAllToBank(player){

    const stocks=[...player.stocks];

    let total=0;

    for(const stock of stocks){

        total+=stock.base;

        stock.owner=null;
        stock.open=false;

        bankStocks.push(stock);

    }

    player.stocks=[];

    player.openStocks.clear();

    player.cash+=total;

    log(
        `🏦 ${player.name} מכר את כל ${stocks.length} המניות לבנק
        וקיבל <strong>${formatMoney(total)}</strong>.
        💰 כסף עכשיו: <strong>${formatMoney(player.cash)}</strong>`,
        "logMoney"
    );

}


/* =========================================================
   BUY
========================================================= */

function buyStock(sellerId,stockUid){

    const buyer=players[currentPlayer];

    if(buyer.isBot) return;

    const seller=players[sellerId];

    const stock=seller.stocks.find(s=>s.uid===stockUid);

    if(!stock || !stock.open) return;

    const minChange=Math.min(...stock.changes);

    const minPrice=stock.base+minChange;

    if(buyer.cash<minPrice){

        log(
            `❌ ${buyer.name} לא יכול לקנות את ${stock.name}.
            המחיר המינימלי האפשרי הוא ${formatMoney(minPrice)},
            אבל יש לו רק ${formatMoney(buyer.cash)}.`,
            "logBad"
        );

        return;

    }

    const die=rollDie();

    const change=stock.changes[die-1];

    const price=stock.base+change;

    log(
        `🎲 ${buyer.name} ניסה לקנות <strong>${stock.name}</strong>
        מ-${seller.name}. הקובייה יצאה <strong>${die}</strong>.
        ${formatChange(change)}
        | בסיס: <strong>${formatMoney(stock.base)}</strong>
        → מחיר עסקה: <strong>${formatMoney(price)}</strong>`,
        "logInfo"
    );

    if(price>buyer.cash){

        log(
            `🚫 העסקה בוטלה!
            המחיר שיצא בקובייה הוא ${formatMoney(price)},
            אבל ל-${buyer.name} יש רק ${formatMoney(buyer.cash)}.
            לא עבר כסף ולא השתנתה הבעלות.`,
            "logBad"
        );

        return;

    }

    buyer.cash-=price;

    seller.cash+=price;

    const index=seller.stocks.indexOf(stock);

    if(index!==-1){

        seller.stocks.splice(index,1);

    }

    seller.openStocks.delete(stock.uid);

    stock.owner=buyer.id;

    buyer.stocks.push(stock);

    stock.open=true;

    buyer.openStocks.add(stock.uid);

    markAction(buyer);

    ensureOneOpen(seller);

    log(
        `💰 העסקה בוצעה!
        ${buyer.name} שילם/ה <strong>${formatMoney(price)}</strong>
        ל-${seller.name}.
        💵 כסף של ${buyer.name}: <strong>${formatMoney(buyer.cash)}</strong>
        | 💵 כסף של ${seller.name}: <strong>${formatMoney(seller.cash)}</strong>`,
        "logGood"
    );

    log(
        `📦 ${stock.name} עבר מ-${seller.name} ל-${buyer.name}
        והוא פתוח למסחר אצל הבעלים החדש.`,
        "logInfo"
    );

    updateScreen();

    checkRoundEnd();

}


/* =========================================================
   HUMAN CAN ACT
========================================================= */

function canHumanAct(){

    const player=players[currentPlayer];

    return !player.isBot && !gameOver;

}


/* =========================================================
   END TURN
========================================================= */

function endTurn(){

    const player=players[currentPlayer];

    if(player.isBot) return;

    finishCurrentTurn(player);

}


function finishCurrentTurn(player){

    /*
       אם לא נעשתה שום פעולה במהלך התור,
       מגדילים את מונה חוסר הפעילות.
    */

    if(player.inactiveTurns===0){

        /*
           אין דרך לדעת כאן אם בוצעה פעולה אחרי ההכנסה
           בלי משתנה נוסף, לכן נשתמש במשתנה turnDidAction.
        */

    }

    if(typeof player.turnDidAction==="undefined"){
        player.turnDidAction=false;
    }

    if(player.turnDidAction){

        player.inactiveTurns=0;

    }else{

        player.inactiveTurns++;

        log(
            `⏸️ ${player.name} לא ביצע פעולה בתור הזה.
            רצף חוסר פעילות: <strong>${player.inactiveTurns}</strong>.`,
            "logInfo"
        );

    }

    player.turnDidAction=false;

    if(player.inactiveTurns>=2){

        bankForcedPurchase(player);

        player.inactiveTurns=0;

    }

    checkRoundEnd();

    if(gameOver) return;

    nextTurn();

}


/* =========================================================
   FORCED BANK PURCHASE
========================================================= */

function bankForcedPurchase(player){

    if(player.stocks.length===0) return;

    const stock=player.stocks[0];

    const value=Math.max(0,stock.base-100);

    player.cash+=value;

    player.stocks.shift();

    player.openStocks.delete(stock.uid);

    stock.owner=null;

    stock.open=false;

    bankStocks.push(stock);

    log(
        `⚠️ הבנק קנה אוטומטית מ-${player.name} את
        <strong>${stock.name}</strong>
        בגלל 2 תורות ללא פעולה.
        מחיר כפוי: <strong>${formatMoney(value)}</strong>.
        💰 כסף עכשיו: <strong>${formatMoney(player.cash)}</strong>`,
        "logBad"
    );

    ensureOneOpen(player);

}


/* =========================================================
   NEXT TURN
========================================================= */

function nextTurn(){

    currentPlayer++;

    turnNumber++;

    if(currentPlayer>=players.length){

        currentPlayer=0;

    }

    updateScreen();

    setTimeout(startTurn,500);

}


/* =========================================================
   BOT TURN
========================================================= */

function botTurn(bot){

    if(gameOver) return;

    log(
        `🤖 <strong>${bot.name}</strong> מתחיל לבצע פעולות...`,
        "logInfo"
    );

    setTimeout(()=>{

        botActions(bot);

    },500);

}


/* =========================================================
   BOT ACTIONS
========================================================= */

function botActions(bot){

    if(gameOver) return;

    /*
       הבוט בוחר כמה פעולות באופן אקראי.
       הוא יכול לקנות, למכור לבנק, לפתוח או לסגור מניה.
    */

    let actionCount=0;

    const maxActions=2+Math.floor(Math.random()*3);

    function doNext(){

        if(actionCount>=maxActions){

            finishCurrentTurn(bot);

            return;

        }

        actionCount++;

        const roll=Math.random();

        if(roll<0.45){

            botBuyStock(bot);

        }else if(roll<0.70){

            botSellToBank(bot);

        }else{

            botToggleStock(bot);

        }

        setTimeout(doNext,650);

    }

    doNext();

}


/* =========================================================
   BOT BUY
========================================================= */

function botBuyStock(bot){

    const possible=[];

    for(const seller of players){

        if(seller.id===bot.id) continue;

        for(const stock of seller.stocks){

            if(!stock.open) continue;

            const minPrice=stock.base+Math.min(...stock.changes);

            if(bot.cash>=minPrice){

                possible.push({
                    seller,
                    stock
                });

            }

        }

    }

    if(possible.length===0){

        log(
            `🤖 ${bot.name} לא מצא מניה שהוא יכול להרשות לעצמו לקנות.`,
            "logInfo"
        );

        return;

    }

    const choice=possible[Math.floor(Math.random()*possible.length)];

    const seller=choice.seller;

    const stock=choice.stock;

    const die=rollDie();

    const change=stock.changes[die-1];

    const price=stock.base+change;

    log(
        `🎲 ${bot.name} מנסה לקנות <strong>${stock.name}</strong>
        מ-${seller.name}.
        🎲 יצא <strong>${die}</strong>.
        ${formatChange(change)}
        | בסיס: <strong>${formatMoney(stock.base)}</strong>
        → מחיר עסקה: <strong>${formatMoney(price)}</strong>`,
        "logInfo"
    );

    if(price>bot.cash){

        log(
            `🚫 העסקה של ${bot.name} בוטלה:
            המחיר ${formatMoney(price)}
            גבוה מהכסף שלו ${formatMoney(bot.cash)}.
            שום דבר לא השתנה.`,
            "logBad"
        );

        return;

    }

    bot.cash-=price;

    seller.cash+=price;

    const index=seller.stocks.indexOf(stock);

    if(index!==-1){

        seller.stocks.splice(index,1);

    }

    seller.openStocks.delete(stock.uid);

    stock.owner=bot.id;

    stock.open=true;

    bot.stocks.push(stock);

    bot.openStocks.add(stock.uid);

    bot.turnDidAction=true;

    ensureOneOpen(seller);

    log(
        `💰 ${bot.name} קנה את ${stock.name}
        מ-${seller.name} תמורת <strong>${formatMoney(price)}</strong>.
        💵 ${bot.name} נשאר עם <strong>${formatMoney(bot.cash)}</strong>.
        💵 ${seller.name} עכשיו עם <strong>${formatMoney(seller.cash)}</strong>.`,
        "logGood"
    );

    updateScreen();

}


/* =========================================================
   BOT SELL
========================================================= */

function botSellToBank(bot){

    if(bot.stocks.length<=1){

        log(
            `🤖 ${bot.name} לא מוכר מניה לבנק כי תישאר לו מניה אחת בלבד.`,
            "logInfo"
        );

        return;

    }

    const stock=bot.stocks[
        Math.floor(Math.random()*bot.stocks.length)
    ];

    const value=stock.base;

    bot.cash+=value;

    const index=bot.stocks.indexOf(stock);

    if(index!==-1){

        bot.stocks.splice(index,1);

    }

    bot.openStocks.delete(stock.uid);

    stock.owner=null;

    stock.open=false;

    bankStocks.push(stock);

    bot.turnDidAction=true;

    ensureOneOpen(bot);

    log(
        `🏦 ${bot.name} מכר את ${stock.name} לבנק
        במחיר הבסיס <strong>${formatMoney(value)}</strong>.
        💰 כסף עכשיו: <strong>${formatMoney(bot.cash)}</strong>.`,
        "logMoney"
    );

    updateScreen();

}


/* =========================================================
   BOT OPEN/CLOSE
========================================================= */

function botToggleStock(bot){

    if(bot.stocks.length===0) return;

    const openStocks=bot.stocks.filter(s=>s.open);

    if(openStocks.length===0){

        const stock=bot.stocks[
            Math.floor(Math.random()*bot.stocks.length)
        ];

        stock.open=true;

        bot.openStocks.add(stock.uid);

        bot.turnDidAction=true;

        log(
            `🔓 ${bot.name} פתח את ${stock.name} למסחר.`,
            "logInfo"
        );

        updateScreen();

        return;

    }

    if(Math.random()<0.5){

        const closed=bot.stocks.filter(s=>!s.open);

        if(closed.length>0){

            const stock=closed[
                Math.floor(Math.random()*closed.length)
            ];

            stock.open=true;

            bot.openStocks.add(stock.uid);

            bot.turnDidAction=true;

            log(
                `🔓 ${bot.name} פתח את ${stock.name} למסחר.`,
                "logInfo"
            );

        }

    }else{

        if(openStocks.length<=1){

            log(
                `🔒 ${bot.name} רצה לסגור מניה,
                אבל ${openStocks[0]?.name || "המניה היחידה"}
                היא המניה הפתוחה היחידה שלו.`,
                "logInfo"
            );

        }else{

            const stock=openStocks[
                Math.floor(Math.random()*openStocks.length)
            ];

            stock.open=false;

            bot.openStocks.delete(stock.uid);

            bot.turnDidAction=true;

            log(
                `🔒 ${bot.name} סגר את ${stock.name} למסחר.`,
                "logInfo"
            );

        }

    }

    ensureOneOpen(bot);

    updateScreen();

}


/* =========================================================
   ROUND END
========================================================= */

function checkRoundEnd(){

    if(gameOver) return;

    const loser=players.find(p=>p.stocks.length===0);

    if(!loser) return;

    log(
        `🏁 הסיבוב הסתיים!
        ${loser.name} הגיע ל-0 מניות.`,
        "logInfo"
    );

    showRoundEnd();

}


/* =========================================================
   ROUND END MODAL
========================================================= */

function showRoundEnd(){

    const human=players[0];

    if(currentRound>=totalRounds){

        setTimeout(()=>finishGame(),500);

        return;

    }

    let html=`

        <h2>🏁 סוף סיבוב ${currentRound}</h2>

        <p>
            חברה אחת הגיעה ל-0 מניות ולכן הסיבוב הסתיים.
        </p>

        <h3>מה אתה רוצה לעשות עם המניות שלך?</h3>

        <p>
            כרגע יש לך ${human.stocks.length} מניות
            ו-${formatMoney(human.cash)}.
        </p>

        <div class="modalButtons">

            <button onclick="finishRoundForHuman(true)">
                🏦 למכור את כל המניות
            </button>

            <button onclick="finishRoundForHuman(false)">
                📦 לשמור את המניות
            </button>

        </div>
    `;

    openModal(html);

}


/* =========================================================
   FINISH ROUND
========================================================= */

function finishRoundForHuman(sell){

    closeModal();

    const human=players[0];

    if(sell){

        sellAllToBank(human);

    }else{

        log(
            `📦 ${human.name} שמר את כל המניות שלו לסיבוב הבא.`,
            "logInfo"
        );

    }

    /*
       הבוטים מחליטים לבד.
    */

    for(const bot of players){

        if(!bot.isBot) continue;

        const shouldSell=Math.random()<0.5;

        if(shouldSell){

            sellAllToBank(bot);

        }else{

            log(
                `📦 ${bot.name} שמר את ${bot.stocks.length} המניות שלו.`,
                "logInfo"
            );

        }

    }

    currentRound++;

    moneyDeck=[];

    createMoneyDeck();

    for(const player of players){

        player.turnDidAction=false;

        player.inactiveTurns=0;

        giveFiveStocks(player);

        ensureOneOpen(player);

    }

    log(
        `🔄 מתחיל סיבוב ${currentRound} מתוך ${totalRounds}.`,
        "logInfo"
    );

    currentPlayer=0;

    turnNumber++;

    updateScreen();

    setTimeout(startTurn,700);

}


/* =========================================================
   FINISH GAME
========================================================= */

function finishGame(){

    gameOver=true;

    const sorted=[...players].sort((a,b)=>b.cash-a.cash);

    let html=`

        <h2>🏆 המשחק הסתיים!</h2>

        <p>
            אחרי ${totalRounds} סיבובים, זה המצב:
        </p>

        <table class="resultsTable">

            <tr>
                <th>מקום</th>
                <th>חברה</th>
                <th>כסף</th>
                <th>מניות</th>
            </tr>
    `;

    sorted.forEach((player,index)=>{

        html+=`

            <tr>

                <td>
                    ${index===0 ? "🥇" :
                      index===1 ? "🥈" :
                      index===2 ? "🥉" :
                      index+1}
                </td>

                <td>${player.name}</td>

                <td>
                    <strong>${formatMoney(player.cash)}</strong>
                </td>

                <td>${player.stocks.length}</td>

            </tr>

        `;

    });

    html+=`

        </table>

        <div class="modalButtons">

            <button onclick="location.reload()">
                🔄 משחק חדש
            </button>

        </div>
    `;

    openModal(html);

    log(
        `🏆 המשחק הסתיים! המנצח הוא <strong>${sorted[0].name}</strong>
        עם <strong>${formatMoney(sorted[0].cash)}</strong>.`,
        "logGood"
    );

}


/* =========================================================
   MODAL
========================================================= */

function openModal(html){

    document.getElementById("modal").innerHTML=html;

    document.getElementById("modalOverlay")
        .classList.remove("hidden");

}


function closeModal(){

    document.getElementById("modalOverlay")
        .classList.add("hidden");

}


/* =========================================================
   RENDER ACTIONS
========================================================= */

function renderActions(){

    const container=document.getElementById("actions");

    container.innerHTML="";

    const player=players[currentPlayer];

    if(!player){

        return;

    }

    if(player.isBot){

        document.getElementById("turnStatus").innerHTML=
            `🤖 <strong>${player.name}</strong> משחק עכשיו...`;

        return;

    }

    document.getElementById("turnStatus").innerHTML=
        `🎮 זה התור שלך. בחר פעולה או סיים את התור.`;

    /*
       Sell buttons
    */

    for(const stock of player.stocks){

        const sell=document.createElement("button");

        sell.textContent=
            `🏦 מכור ${stock.name} (${formatMoney(stock.base)})`;

        sell.onclick=()=>sellToBank(stock.uid);

        container.appendChild(sell);

    }

    /*
       Open / close
    */

    for(const stock of player.stocks){

        const button=document.createElement("button");

        button.textContent=
            stock.open
            ? `🔒 סגור ${stock.name}`
            : `🔓 פתח ${stock.name}`;

        button.onclick=()=>toggleStock(stock.uid);

        container.appendChild(button);

    }

    /*
       Buy buttons
    */

    for(const seller of players){

        if(seller.id===player.id) continue;

        for(const stock of seller.stocks){

            if(!stock.open) continue;

            const minPrice=
                stock.base+Math.min(...stock.changes);

            const button=document.createElement("button");

            button.textContent=
                `🛒 קנה ${stock.name} מ-${seller.name}
                (מינ' ${formatMoney(minPrice)})`;

            button.disabled=player.cash<minPrice;

            button.onclick=()=>buyStock(seller.id,stock.uid);

            container.appendChild(button);

        }

    }

    /*
       End turn
    */

    const end=document.createElement("button");

    end.textContent="➡️ סיים תור";

    end.onclick=endTurn;

    container.appendChild(end);

}


/* =========================================================
   RENDER COMPANIES
========================================================= */

function renderCompanies(){

    const board=document.getElementById("board");

    board.innerHTML="";

    for(const player of players){

        const div=document.createElement("div");

        div.className=
            "company"
            +(player.id===currentPlayer ? " current":"")
            +(player.isBot ? " bot":"");

        let stocksHtml="";

        if(player.stocks.length===0){

            stocksHtml=
                `<div style="color:#999">אין מניות</div>`;

        }else{

            for(const stock of player.stocks){

                stocksHtml+=`

                    <div class="stock ${stock.open?"open":""}">

                        <div class="stockInfo">

                            <div class="stockName">
                                ${stock.name}
                            </div>

                            <div class="stockBase">
                                בסיס: ${formatMoney(stock.base)}
                            </div>

                            <div class="${stock.open?"openBadge":""}">
                                ${stock.open
                                    ? "🟠 פתוחה למסחר"
                                    : "⚫ סגורה למסחר"}
                            </div>

                        </div>

                    </div>
                `;

            }

        }

        div.innerHTML=`

            <div class="companyHeader">

                <h2>
                    ${player.isBot ? "🤖 ":"🏢 "}
                    ${player.name}
                </h2>

                <div class="cash">
                    💰 ${formatMoney(player.cash)}
                </div>

            </div>

            <div style="margin-top:5px;color:#666">
                ${player.stocks.length} מניות
            </div>

            <div class="stockArea">
                ${stocksHtml}
            </div>

        `;

        board.appendChild(div);

    }

}


/* =========================================================
   UPDATE SCREEN
========================================================= */

function updateScreen(){

    if(!players.length) return;

    document.getElementById("roundInfo").textContent=
        `סיבוב ${currentRound}/${totalRounds}`;

    document.getElementById("turnInfo").textContent=
        `תור ${turnNumber}`;

    document.getElementById("currentInfo").textContent=
        `עכשיו: ${players[currentPlayer].name}`;

    renderCompanies();

    renderActions();

}


/* =========================================================
   ACTION MARKER PATCH
========================================================= */

/*
   כל פעולה אמיתית של שחקן מסומנת כאן.
*/

const originalMarkAction=markAction;

markAction=function(player){

    player.turnDidAction=true;

    player.inactiveTurns=0;

};

   INITIAL
========================================================= */

</script>
